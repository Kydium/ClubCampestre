/* ---------- tratos ---------- */
function flip(fn){
  const root=$('modal'),old={};
  root.querySelectorAll('[data-k]').forEach(e=>{old[e.dataset.k]=e.getBoundingClientRect();});
  fn();
  root.querySelectorAll('[data-k]').forEach(e=>{
    const f=old[e.dataset.k];if(!f)return;
    const r=e.getBoundingClientRect(),dx=f.left-r.left,dy=f.top-r.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    e.animate([{transform:`translate(${dx}px,${dy}px) scale(1.12)`,zIndex:5},{transform:'none',zIndex:5}],{duration:480,easing:'cubic-bezier(.2,.9,.3,1.12)'});
  });
}
function trTo(id){ui.tr=newTr();ui.tr.to=id;ui.trHint='';renderModal();}
function trTog(side,i){const L=ui.tr[side].props,k=L.indexOf(i);if(k>=0)L.splice(k,1);else L.push(i);ui.trHint=SQ[i].n+' · '+money(SQ[i].p);ui.trSel={side,i};ui.trPrev='card';flip(()=>renderModal());}
function trJc(side,d){const pl=side==='give'?P(S,me):P(S,ui.tr.to),n=ui.tr[side].jc||0,nv=Math.max(0,Math.min(pl.jc.length,n+(d||1)));if(nv===n)return;ui.tr[side].jc=nv;ui.trHint='Carta de salir de la cárcel';flip(()=>renderModal());}
function trRoom(side){const pl=side==='give'?P(S,me):P(S,ui.tr.to);return Math.max(0,pl.money-(ui.tr[side].cash||0));}
function trDraft(side,n){ui.trd[side]=Math.max(0,Math.min(trRoom(side),(ui.trd[side]||0)+n));ui.trPrev='money';ui.trLast=side;renderModal();}
function trDraftSet(side,v){ui.trd[side]=Math.max(0,Math.min(trRoom(side),Math.floor(+v||0)));ui.trPrev='money';ui.trLast=side;renderModal();}
/* el monto recién pasa a la oferta cuando se toca "Dar" / "Pedir" */
function trGive(side,btn){
  const c=ui.tr[side],d=ui.trd[side]||0;
  if(d<=0){toast('Pon un monto primero');return;}
  const add=Math.min(d,trRoom(side));
  if(add<=0){toast('No hay más efectivo para ofrecer');return;}
  const from=btn?btn.getBoundingClientRect():null;
  ui.stkAnim={side,until:Date.now()+900};
  flip(()=>{c.cash=(c.cash||0)+add;ui.trd[side]=0;renderModal();});
  const chip=document.querySelector('[data-k="cash-'+side+'"]');
  if(chip){chip.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:380,delay:330});if(from)flyBills(from,chip.getBoundingClientRect(),add);}
}
function trSet(side,v){
  const c=ui.tr[side],nv=Math.max(0,Math.min(Math.floor(+v||0),(side==='give'?P(S,me):P(S,ui.tr.to)).money));
  if(nv===(c.cash||0)){renderModal();return;}
  flip(()=>{c.cash=nv;renderModal();});
}
function trNone(){}
function startCounter(){
  const T=S&&S.trade;if(!T||T.to!==me)return;
  const t=newTr();t.to=T.from;
  t.give={cash:T.get.cash||0,props:[...T.get.props],jc:T.get.jc||0};   /* lo que me pedían, ahora lo ofrezco yo (y puedo cambiarlo) */
  t.get={cash:T.give.cash||0,props:[...T.give.props],jc:T.give.jc||0};
  ui.counter=true;ui.tr=t;ui.modal={type:'trade'};ui.trHint='';
  renderIncoming();renderModal();
}
function trSend(){
  const t=ui.tr;if(!t||!t.to){toast('Elige con quién');return;}
  const why=ui.counter?((animBusy()||S.card)?'Espera a que termine la jugada':''):tradeBlock();
  if(why){toast(why);return;}
  if(ui.counter){ui.hideInc=S.trade?S.trade.id:0;D('tradeCounter',{give:t.give,get:t.get});ui.counter=false;}
  else D('tradeOffer',{to:t.to,give:t.give,get:t.get});
  SND.swish();clearDraft();
  ui.modal=null;ui.tr=null;renderModal();
}
/* recuadro de color */
/* carta de salir de la cárcel: 'pool' = en tu lista, 'ghost' = hueco de una ya elegida, 'offer' = en la oferta */
/* carta chica de propiedad para los tratos: banda de color con sigla + precio */
function abbr(n){
  const cl=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  const w=n.replace(/[().]/g,' ').split(/\s+/).filter(x=>x&&!/^(de|del|la|el)$/i.test(x));
  if(w.length<=1)return cl(w[0]||n).slice(0,5);
  return cl(w.map(x=>x[0]).join('')).slice(0,3);
}
function tcard(i,pl,o){
  o=o||{};
  const sq=SQ[i],has=S.owner[i]===pl.id&&!o.ghost,od=(S.owner[i]!==undefined&&S.owner[i]!==pl.id)?P(S,S.owner[i]):null;
  const st=has?` style="background:${GC[sq.g]};color:${LIGHTG[sq.g]?'#111':'#fff'}"`:'';
  return`<div class="tzc${has?'':' gray'}${o.ghost?' ghost':''}${o.off?' off':''}${(S.mort[i]&&has)?' mort':''}"${o.key?` data-k="${o.key}"`:''}${o.click?` onclick="${o.click}"`:''}><div class="tzb"${st}>${abbr(sq.n)}</div><div class="tzp">${sq.p}</div>${od?`<i class="tzod" style="--c:${od.col}"></i>`:''}</div>`;
}
const tjc=(side,k,mode)=>mode==='ghost'
  ?`<div class="tzc ghost"><div class="tzb" style="background:#ffd34d;color:#4a2700">SALIR</div><div class="tzp">🎟</div></div>`
  :`<div class="tzc" data-k="jc-${side}-${k}" onclick="trJc('${side}',${mode==='offer'?-1:1})"><div class="tzb" style="background:#ffd34d;color:#4a2700">SALIR</div><div class="tzp">🎟</div></div>`;
/* el dinero que se ofrece se dibuja como un fajo: billetes apilados (máximo 200) y monedas sueltas */
function cashChip(a,side,click){
  const {bills,coins}=heapParts(walFrom(a)),anim=ui.stkAnim&&ui.stkAnim.side===side&&Date.now()<ui.stkAnim.until;
  const w=coins.length?108:56;
  return`<div class="cstk" data-k="cash-${side}"${click?` onclick="trSet('${side}',0)"`:''}><div class="heap2" style="width:${w}px;--sp:${Math.min(4.4,46/Math.max(1,bills.length-1)).toFixed(2)}px"><div class="tw2">${bills.map((d,i)=>heapSheet(i,d,anim?' in':'')).join('')}</div><div class="cn2">${coins.map((d,i)=>coinHTML(i,d)).join('')}</div></div><b>S/ ${a}</b></div>`;
}
/* flechas ◀ ▶ del dinero: un toque cambia de 10 en 10; si mantienes presionado acelera */
function trFan(side,a){
  const tv=document.querySelector('#modal .tv3');if(!tv)return;
  const fan=tv.querySelector('.fan');
  if(!fan||a<=0){tv.outerHTML=trPrevHTML();return;}        /* cambia de modo: se dibuja una sola vez */
  const list=billsFor(a).slice(0,7),n=list.length;
  fan.style.setProperty('--sp',Math.max(8,Math.min(15,90/Math.max(1,n))).toFixed(0)+'px');
  while(fan.children.length>n)fan.lastElementChild.remove();
  list.forEach((v,k)=>{
    let el=fan.children[k];
    if(!el){el=document.createElement('span');el.className='fb';fan.appendChild(el);}
    el.style.setProperty('--k',k);el.style.setProperty('--n',n);
    if(el.dataset.v!==String(v)){el.dataset.v=String(v);el.innerHTML=billHTML(v);}
  });
  const fl=tv.querySelector('.fll');if(fl)fl.innerHTML=(side==='give'?'Vas a dar':'Vas a pedir')+' <b>'+money(a)+'</b>';
}
function trStep(side,d){
  const cur=ui.trd[side]||0,nv=Math.max(0,Math.min(trRoom(side),cur+d));
  if(nv===cur)return;
  ui.trd[side]=nv;ui.trPrev='money';ui.trLast=side;
  if(SND.gate('stp',55))SND.tick();
  const pn=document.querySelector('#modal .tm3[data-side="'+side+'"]');
  if(pn){
    const inp=pn.querySelector('.ts3 input');if(inp)inp.value=nv||'';
    const bt=pn.querySelector('button.dar');
    if(bt)bt.disabled=!(nv>0);
  }
  const pm=document.querySelector('#modal .tp3[data-side="'+side+'"] .tp3m');if(pm)pm.textContent=money(trLeft(side));
  trFan(side,nv);
  /* cuando se deja de tocar, se anota cómo quedó la pantalla para que las jugadas ajenas no la redibujen */
  clearTimeout(ui.sigT);
  ui.sigT=setTimeout(()=>{const m=$('modal');if(ui.modal&&ui.modal.type==='trade'&&m.dataset.mk===ui.modal.type+'|'+ui.modal.arg)m.dataset.sig=tradeHTML()+'<button class="sec big" onclick="closeModal()">Cerrar</button>';},350);
}
/* flechas ◀ ▶: suman o restan de 1 en 1; si mantienes presionado se repite cada vez más rápido */
function trHoldStart(side,dir){
  trStep(side,dir);
  clearTimeout(ui.holdT);clearTimeout(ui.holdI);
  const t0=Date.now();
  const rep=()=>{trStep(side,dir);const el=Date.now()-t0;ui.holdI=setTimeout(rep,el>2500?35:(el>1200?65:115));};
  ui.holdT=setTimeout(rep,450);
}
function trHoldEnd(){clearTimeout(ui.holdT);clearTimeout(ui.holdI);}
const blocked=i=>GR[SQ[i].g].some(j=>(S.houses[j]||0)>0);
/* primer toque: se ve la carta en el centro; segundo toque (o el botón): pasa a la oferta */
/* un toque: la propiedad pasa directo a la oferta y se ve su carta completa en el centro */
function trPick(side,i){
  ui.trSel={side,i};ui.trPrev='card';
  if(blocked(i)){renderModal();return;}
  trTog(side,i);
}
/* cuadrícula chica de propiedades: solo colores, ordenados por color */
function trGrid(side,pl){
  const t=ui.tr[side];
  return'<div class="mg5">'+GORD.map(g=>`<div class="mgc">${GR[g].map(i=>{
    if(S.owner[i]!==pl.id)return'<i class="mr no"></i>';
    const c=`style="--c:${GC[SQ[i].g]}"`;
    if(t.props.includes(i)){const sl=ui.trSel&&ui.trSel.side===side&&ui.trSel.i===i;return`<i class="mr ghost${sl?' sel':''}" ${c} onclick="trTog('${side}',${i})"></i>`;}
    const sel=ui.trSel&&ui.trSel.side===side&&ui.trSel.i===i;

  }).join('')}</div>`).join('')+'</div>';

/* panel de un jugador: ficha colgando, dinero, propiedades, flechas de dinero y botón Dar/Pedir */
/* lo que le quedaría a ese jugador: su dinero menos lo que ya puso en la oferta y lo que está preparando */
function trLeft(side){const pl=side==='give'?P(S,me):P(S,ui.tr.to);return pl.money-(ui.tr[side].cash||0)-(ui.trd[side]||0);}
function trPanel(side,pl){
  const t=ui.tr[side];
  const jcs=pl.jc.length?`<div class="tzjr">${pl.jc.map((_,k)=>tjc(side,k,k<(t.jc||0)?'ghost':'pool')).join('')}</div>`:'';
  return`<div class="tp3" data-side="${side}" style="${pkVars(pl.col)}"><span class="tp3k">${pl.tk}</span><div class="tp3i"><span class="a">${av(pl,18)}${esc(pl.name)}${pl.id===me?' ·tú':''}</span></div><div class="tp3m">${money(trLeft(side))}</div>${trGrid(side,pl)}${jcs}${trMoney(side,pl)}</div>`;
}
/* controles de dinero de un jugador (van a los lados de la vista previa) */
function trMoney(side,pl){
  const d=ui.trd[side]||0,room=trRoom(side),give=side==='give';
  return`<div class="tm3" data-side="${side}" style="${pkVars(pl.col)}">
    <div class="ts3" data-k="ctl-${side}"><button class="ar" onpointerdown="trHoldStart('${side}',-1)">◀</button><div class="amt">S/<input type="number" inputmode="numeric" min="0" placeholder="0" value="${d||''}" onchange="trDraftSet('${side}',this.value)"></div><button class="ar" onpointerdown="trHoldStart('${side}',1)">▶</button></div>
    <button class="pri dar" ${d>0?'':'disabled'} onclick="trGive('${side}',this)">${give?'💸 Dar':'🎁 Pedir'}</button></div>`;

/* vista previa del centro: la carta elegida, o los billetes del monto que se prepara */
function trDeed(i){
  const sq=SQ[i],h=S.houses[i]||0,fg=LIGHTG[sq.g]?'#111':'#fff';
  const rent=sq.t==='prop'?`Renta <b>S/${sq.r[0]}</b> · hotel <b>S/${sq.r[5]}</b>`:(sq.t==='rr'?'Renta <b>S/25</b> a <b>S/200</b>':'Renta <b>4×</b> o <b>10×</b> los dados');
  return`<div class="tdeed"><div class="dh" style="background:${GC[sq.g]};color:${fg}"><small>${sq.i||''} ${GN[sq.g].toUpperCase()}</small><b>${esc(sq.n)}</b></div><div class="db"><div>Precio <b>S/${sq.p}</b></div><div>${rent}</div><div>Hipoteca <b>S/${sq.p/2}</b>${S.mort[i]?' · 🔒':''}</div>${(h&&sq.t==='prop')?`<div>${h===5?'🏨 hotel':'🏠 ×'+h}</div>`:''}</div></div>`;
}
function trPrevHTML(){
  let body;
  const side=ui.trLast,a=ui.trd[side]||0;
  if(ui.trPrev==='money'&&a>0){
    const list=billsFor(a).slice(0,7),n=list.length;
    const sp=Math.max(8,Math.min(15,90/Math.max(1,n)));
    body=`<div class="fan" style="--sp:${sp.toFixed(0)}px">${list.map((v,k)=>`<span class="fb" data-v="${v}" style="--k:${k};--n:${n}">${billHTML(v)}</span>`).join('')}</div><div class="fll">${side==='give'?'Vas a dar':'Vas a pedir'} <b>${money(a)}</b></div>`;
  }else if(ui.trSel){
    const {side:sd,i}=ui.trSel,bl=blocked(i),inO=ui.tr[sd].props.includes(i);

    body=`<div class="dtlw">${ppDetail(i,false)}</div><div class="tst${bl?' bad':(inO?' ok':'')}">${bl?'⚠️ Tiene edificios: no se puede tratar':(inO?(sd==='give'?'✓ La ofreces':'✓ La pides'):'Quitada')}</div>`;
  }else body='<div class="mag">🔍<small>Toca una propiedad de color para verla</small></div>';
  return`<div class="tv3">${body}</div>`;
}
/* cartas en su tamaño original (152 × 228), apiladas un poco para que quepan varias */
const dcard=(i,o)=>`<div class="dcw${o&&o.click?' clk':''}"${o&&o.key?` data-k="${o.key}"`:''}${o&&o.click?` onclick="${o.click}"`:''}>${deedHTML(i)}</div>`;
/* versión chica (para los espectadores): franja de color con el nombre y el precio */
const mcard=i=>{const q=SQ[i],fg=LIGHTG[q.g]?'#111':'#fff';return`<div class="mcw"><div class="mcn" style="background:${GC[q.g]||'#9aa7b1'};color:${fg}">${esc(q.n)}</div><div class="mcp">${money(q.p)}</div></div>`;};
const jcStatic=()=>`<div class="tzc"><div class="tzb" style="background:#ffd34d;color:#4a2700">SALIR</div><div class="tzp">🎟</div></div>`;
/* dinero compacto para ir a la derecha de las cartas: pilita de billetes y el monto */
function cashMini(a,side,edit){
  const {bills}=heapParts(walFrom(a)),n=Math.min(4,bills.length);
  return`<div class="cstk cmini" data-k="cash-${side}"${edit?` onclick="trSet('${side}',0)"`:''}><div class="heap2" style="width:56px;--sp:${Math.min(4.4,46/Math.max(1,n-1)).toFixed(2)}px"><div class="tw2">${bills.slice(0,n).map((d,i)=>heapSheet(i,d,'')).join('')}</div></div><b>S/${a}</b></div>`;
}
function oqItems(s,o){
  if(!o.mini&&(s.props||[]).length){
    const c=s.props.map(i=>dcard(i,o.edit?{key:'s'+i,click:`trTog('${o.side}',${i})`}:null)).join('');
    const mm=(s.cash?cashMini(s.cash,o.cashKey||o.side,!!o.edit):'')+Array.from({length:s.jc||0},(_,k)=>o.edit?tjc(o.side,k,'offer'):jcStatic()).join('');
    return`<div class="oq-r"><div class="oq-c">${c}</div>${mm?`<div class="oq-m rt">${mm}</div>`:''}</div>`;
  }
  return oqItemsTop(s,o);
}
function oqItemsTop(s,o){
  let m='';
  if(s.cash)m+=cashChip(s.cash,o.cashKey||o.side,!!o.edit);
  m+=Array.from({length:s.jc||0},(_,k)=>o.edit?tjc(o.side,k,'offer'):jcStatic()).join('');
  const c=(s.props||[]).map(i=>o.mini?mcard(i):dcard(i,o.edit?{key:'s'+i,click:`trTog('${o.side}',${i})`}:null)).join('');
  if(!m&&!c)return`<div class="emp">${o.empty||'Nada'}</div>`;
  return(m?`<div class="oq-m">${m}</div>`:'')+(c?`<div class="oq-c">${c}</div>`:'');
}
function oqBox(L,R,tot,cls){
  return`<div class="oq${cls?' '+cls:''}"><div class="oq-tabs"><div class="oq-t" style="${pkVars(L.pl.col)}"><span>${L.pl.tk}</span><b>${L.label}</b></div><div class="oq-t r" style="${pkVars(R.pl.col)}"><span>${R.pl.tk}</span><b>${R.label}</b></div></div><div class="oq-box"><div class="oq-h" style="${pkVars(L.pl.col)}"><div class="oq-s">${L.items}</div></div><div class="oq-h r" style="${pkVars(R.pl.col)}"><div class="oq-s">${R.items}</div></div></div>${tot}</div>`;
}
function totalBar(a,b,pa,pb,la,lb){
  return`<div class="tvb"><div class="tvh">VALOR TOTAL</div><div class="tvr"><div class="tvl" style="${pkVars(pa.col)}"><small>${la}</small><b>${money(tradeVal(a))}</b></div><div class="tvd" style="${pkVars(pb.col)}"><small>${lb}</small><b>${money(tradeVal(b))}</b></div></div></div>`;
}
const tradeVal=s=>(s.cash||0)+s.props.reduce((a,i)=>a+SQ[i].p,0);
function totHTML(s){
  const pp=s.props.reduce((a,i)=>a+SQ[i].p,0),v=(s.cash||0)+pp;
  if(!v)return'';
  return`<div class="tot"><span>💰 Valor total</span><b>${money(v)}</b></div><div class="totd">${s.cash?'dinero '+money(s.cash):''}${s.cash&&pp?' + ':''}${pp?'propiedades '+money(pp):''}</div>`;
}
function tradeHTML(){
  const t=ui.tr,others=act(S).filter(p=>p.id!==me);
  let h=ui.counter?'<h3>🔁 Contraoferta</h3>':'<h3>🤝 Intercambiar</h3>';
  if(S.trade&&!ui.counter)return h+'<div class="note">Ya hay un trato pendiente. Espera a que se resuelva.</div>';
  if(S.auction)return h+'<div class="note">Hay una subasta en curso.</div>';
  if(ui.counter){const o=P(S,t.to);h+=`<div class="note">Ajusta lo que pide ${o.tk} <b>${esc(o.name)}</b> y envíaselo de vuelta.</div>`;}
  else h+='<div class="chipsel">'+others.map(p=>`<button class="${t.to===p.id?'pri':'sec'}" onclick="trTo('${p.id}')">${p.tk} ${esc(p.name)}</button>`).join('')+'</div>';
  if(!t.to)return h+'<p class="mut">Elige con quién quieres intercambiar.</p>';
  const mp=P(S,me),op=P(S,t.to);
  h+=`<div class="tpns3">${trPanel('give',mp)}${trPrevHTML()}${trPanel('get',op)}</div>`;
  h+=oqBox({pl:mp,label:'OFRECE',items:oqItems(t.give,{side:'give',edit:true,empty:'Lo que ofreces aparece aquí'})},{pl:op,label:'QUIERE',items:oqItems(t.get,{side:'get',edit:true,empty:'Lo que pides aparece aquí'})},totalBar(t.give,t.get,mp,op,'ofrece','quiere'));
  h+='<button class="big pri" onclick="trSend()">'+(ui.counter?'Enviar contraoferta 🔁':'Enviar oferta 🤝')+'</button>';
  return h;
}
function setStat(m){ui.statMode=m;renderModal();}
const kfmt=v=>v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v));
function bankHTML(){
  const free=[];for(let i=0;i<40;i++){const q=SQ[i];if((q.t==='prop'||q.t==='rr'||q.t==='util')&&S.owner[i]===undefined)free.push(i);}
  const s=supply(S);
  const grid='<div class="mg5 bkg">'+GORD.map(g=>`<div class="mgc">${GR[g].map(i=>S.owner[i]===undefined?`<i class="mr" style="--c:${GC[SQ[i].g]}"></i>`:'<i class="mr no"></i>').join('')}</div>`).join('')+'</div>';
  return`<div class="bank"><div class="bkh">🏦 INFO BANCA</div><div class="bk3"><div><b>${free.length}</b><small>propiedades libres</small></div><div><b>${32-s.hs}</b><small>casas restantes</small></div><div><b>${12-s.ht}</b><small>hoteles restantes</small></div></div>${grid}</div>`;
}
function statsHTML(){
  const mode=ui.statMode;
  /* historial por turno + un punto "ahora" con los valores en vivo */
  const live=S.players.map(p=>mode==='n'?netWorth(S,p):(p.bankrupt?0:Math.round(p.money)));
  const H=((mode==='n'?S.hs:S.hc)||[]).concat([live]);
  let h='<h3>📈 Estadísticas <span class="livetag">● EN VIVO</span></h3>'+bankHTML();
  h+=`<div class="tabs"><button class="${mode==='n'?'pri':'sec'}" onclick="setStat('n')">Patrimonio</button><button class="${mode==='c'?'pri':'sec'}" onclick="setStat('c')">Efectivo</button></div>`;
  if(H.length<2)return h+'<div class="note">Todavía no hay suficientes datos. Juega unos turnos y vuelve a mirar 😉</div>';
  const W=340,HT=230,L=40,R=12,T=14,B=26,n=H.length;
  let mx=0;H.forEach(r=>r.forEach(v=>{if(v>mx)mx=v;}));mx=Math.max(100,mx);
  const step=[100,200,250,500,1000,2000,2500,5000,10000].find(s=>mx/s<=4)||10000,top=Math.ceil(mx/step)*step;
  const X=i=>L+(n===1?0:i*(W-L-R)/(n-1)),Y=v=>T+(HT-T-B)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${HT}" role="img" aria-label="Gráfico de líneas">`;
  for(let v=0;v<=top;v+=step){svg+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff${v===0?'66':'22'}" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${kfmt(v)}</text>`;}
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${X(i)}" y="${HT-8}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${i===n-1?'ahora':'turno '+i}</text>`;});
  S.players.forEach((p,pi)=>{
    if(p.left)return;
    const pts=H.map((r,i)=>`${X(i).toFixed(1)},${Y(r[pi]===undefined?0:r[pi]).toFixed(1)}`).join(' ');
    svg+=`<polyline class="ln${ui.statFresh?' draw':''}" pathLength="1" points="${pts}" stroke="${p.col}"/>`;
    const last=H[n-1][pi]||0;svg+=`<circle cx="${X(n-1)}" cy="${Y(last)}" r="4.5" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>`;
  });
  svg+='</svg>';
  h+=`<div class="chartbox">${svg}</div>`;
  const last=H[n-1];
  h+='<div class="lgd">'+S.players.map((p,pi)=>({p,v:last[pi]||0})).filter(o=>!o.p.left).sort((a,b)=>b.v-a.v).map(o=>`<div class="li" style="--c:${o.p.col}"><span>${o.p.tk}</span><span>${esc(o.p.name)}${o.p.bankrupt?' 💀':''}</span><span class="pm2">${money(o.v)}</span></div>`).join('')+'</div>';
  h+=`<div class="mut" style="text-align:center">${mode==='n'?'Patrimonio = efectivo + propiedades + edificios':'Efectivo que tiene cada jugador'} · un punto por turno y el último en vivo</div>`;
  return h;
}
function renderIncoming(){
  const c=$('incoming');
  if(!S||S.phase!=='play'||!S.trade||S.trade.to!==me||ui.counter||S.trade.id===ui.hideInc){if(c.innerHTML){c.innerHTML='';c.dataset.sig='';}return;}
  const T=S.trade,fr=P(S,T.from),mp=P(S,me);
  const html=`<div class="ov"><div class="sheet wide"><div class="qband" style="${pkVars(mp.col)}"><span>${mp.tk}</span><b>${esc(mp.name)}, ¿aceptas ${T.ctr?'esta contraoferta':'esta oferta'}?</b></div><div class="mut" style="margin-top:-4px">${T.ctr?'🔁 Contraoferta de':'🤝 Oferta de'} ${fr.tk} ${esc(fr.name)}</div>${oqBox({pl:fr,label:'OFRECE',items:oqItems(T.give,{side:'incA'})},{pl:mp,label:'QUIERE',items:oqItems(T.get,{side:'incB'})},totalBar(T.give,T.get,fr,mp,'ofrece','quiere'))}<div class="row"><button class="pri" onclick="D('tradeAccept')">Aceptar</button><button class="sec" onclick="startCounter()">🔁 Contraoferta</button><button class="bad" onclick="D('tradeCancel')">Rechazar</button></div></div></div>`;
  if(c.dataset.sig!==html){c.innerHTML=html;c.dataset.sig=html;}
}

/* ---------- arranque ---------- */
function boot(){
  ui.flat=store.get('mono_3d')==='0';ui.cam=store.get('mono_cam')==='1';ui.rot=store.get('mono_rot')!=='0';{const sv=store.get('mono_sway');ui.sway=sv===null?!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches):sv!=='0';}if(ui.cam)setTimeout(camStart,500);ui.side=store.get('mono_side_v')==='2'?(store.get('mono_side')||'cards'):'cards';setInterval(tickTokens,120);setInterval(pruneTick,1000);
  ['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>SND.unlock(),{passive:true,capture:true}));
  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('button,.pk,.cc,.rm,.sq');
    if(!el||el.disabled||el.closest('#tray')||el.closest('.cov'))return;
    if(el.classList.contains('cc')){if(!el.classList.contains('gray')&&!el.classList.contains('off'))SND.pick();}
    else if(el.classList.contains('sq'))SND.tick();
    else SND.click();
  },true);
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,trHoldEnd,true));
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,diceUp,true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ui.pres&&connected)ui.pres.go();});
  window.addEventListener('online',()=>{if(ui.retry)resume();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')SND.unlock();if(document.visibilityState==='visible'&&db&&(ref||ui.retry)){if(!connected){try{db.goOffline();db.goOnline();}catch(e){}}if(ui.retry)resume();}});
  if(typeof firebase==='undefined'){$('app').innerHTML=fatal('No cargó Firebase','Revisa tu conexión a internet y recarga la página.');if(window.BOOT)BOOT.flag('connected');return;}
  try{firebase.initializeApp(FBCFG);db=firebase.database();}
  catch(e){$('app').innerHTML=fatal('Error al iniciar Firebase',esc(e.message));if(window.BOOT)BOOT.flag('connected');return;}
  monoCuenta();
  db.ref('.info/serverTimeOffset').on('value',s=>{ui.srvOff=+s.val()||0;});
  setTimeout(sweepRooms,5000);setInterval(sweepRooms,300000);
  db.ref('.info/connected').on('value',s=>{connected=!!s.val();const d=$('dot');if(d)d.className='dot '+(connected?'on':'off');if(connected&&window.BOOT){BOOT.stage(88,'Entrando…');BOOT.flag('connected');}});
  if(window.BOOT)BOOT.stage(75,'Conectando con Firebase…');
  resume();
}
/* ===== CUENTA, EXPERIENCIA Y AVATAR DEL CLUB CAMPESTRE =====
   El menú (../) guarda cc_uid al iniciar sesión. Sin sesión se vuelve al menú para entrar. */
const ACCT_UID=(()=>{try{return localStorage.getItem('cc_uid')||''}catch(e){return ''}})();
function monoCuenta(){
  if(!ACCT_UID){try{location.replace('../')}catch(e){}return;}
  try{
    firebase.auth().onAuthStateChanged(u=>{
      if(!u){localStorage.removeItem('cc_uid');localStorage.removeItem('cc_name');location.replace('../');return;}
      if(u.uid!==ACCT_UID){localStorage.setItem('cc_uid',u.uid);location.reload();}
    });
    if(window.ClubXP){
      try{ClubXP.config({levelUp:()=>{try{SND.win()}catch(e){}}});}catch(e){}
      ClubXP.init({db:db,uid:ACCT_UID,game:'monopoly',legacy:0});
    }
    if(window.ClubAvatar){try{ClubAvatar.init({db:db});}catch(e){}}
  }catch(e){}
}
// ⭐ Experiencia: 25 por terminar la partida, +75 si ganas
function monoXp(){
  try{
    if(!window.ClubXP||!S||S.phase!=='end'||!code)return;
    const mp=P(S,me);if(!mp)return;
    ClubXP.add(25+(S.winner===me?75:0),'monopoly',{key:code+'_'+(S.ln||0)+'_'+S.winner});
  }catch(e){}
}
/* avatar: cada jugador con cuenta guarda su uid (au); los elementos .av se pintan solos cuando aparecen */
const av=(p,sz)=>p&&p.au?`<span class="av" data-au="${esc(p.au)}" data-nm="${esc(p.name||'')}" data-sz="${sz}"></span>`:'';
function avPaint(){
  if(!window.ClubAvatar)return;
  document.querySelectorAll('.av[data-au]:not([data-ok])').forEach(el=>{el.dataset.ok='1';try{ClubAvatar.render(el.dataset.au,el,{name:el.dataset.nm,size:+el.dataset.sz||24,shape:'circle'});}catch(e){}});
}
function avWatch(){
  try{new MutationObserver(()=>{if(ui.avT)return;ui.avT=requestAnimationFrame(()=>{ui.avT=0;avPaint();});}).observe(document.body,{childList:true,subtree:true});}catch(e){}
  avPaint();
}
document.addEventListener('DOMContentLoaded',avWatch);
document.addEventListener('DOMContentLoaded',boot);
</script>
