<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>🎩 Monopoly Amigos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--fh:"Lilita One","Trebuchet MS","Segoe UI",system-ui,sans-serif}
html,body{margin:0;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none;background:radial-gradient(130% 70% at 50% -5%,#4a9bff 0%,#2150c4 38%,#0d1b66 78%,#080f3d 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% -10%,#ffffff0d 0 6deg,transparent 6deg 12deg);opacity:.7}
#app,#modal,#incoming{position:relative}
button{font:inherit;font-family:var(--fh);letter-spacing:.02em;color:#fff;border:0;border-radius:14px;padding:12px 14px;background:linear-gradient(#5a90f5,#2c5cc9);box-shadow:0 4px 0 #17348a,0 7px 10px #0006,inset 0 1px 0 #ffffff66;text-shadow:0 1px 0 #0005;cursor:pointer;touch-action:manipulation;line-height:1.15;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #17348a,0 3px 5px #0006,inset 0 1px 0 #ffffff66}
button *{pointer-events:none}
button:disabled{opacity:.45;filter:grayscale(.5)}
button.pri{background:linear-gradient(#ffe066,#ff9f1c);color:#4a2700;text-shadow:0 1px 0 #fff8;box-shadow:0 4px 0 #b25f00,0 7px 10px #0006,inset 0 1px 0 #fffa}
button.pri:active:not(:disabled){box-shadow:0 1px 0 #b25f00,0 3px 5px #0006,inset 0 1px 0 #fffa}
button.sec{background:linear-gradient(#4a78d8,#2a4fae);box-shadow:0 4px 0 #142c78,0 7px 10px #0006,inset 0 1px 0 #ffffff55}
button.bad{background:linear-gradient(#ff6a5f,#c8281f);box-shadow:0 4px 0 #7d140e,0 7px 10px #0006,inset 0 1px 0 #ffffff66}
button small{display:block;font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:11px;opacity:.85;margin-top:2px;text-shadow:none}
.big{width:100%;padding:16px;font-size:20px}
input,select{font:inherit;width:100%;padding:13px 14px;border-radius:14px;border:3px solid #8fbaff;background:#fff;color:#14306f;font-weight:800;outline:none;box-shadow:inset 0 2px 4px #0003}
input:focus{border-color:#ffd34d}
input::placeholder{color:#8a9bc7;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:10px 10px 104px;display:flex;flex-direction:column;gap:12px;position:relative}
.top{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chip{background:linear-gradient(#173586,#102766);border:2px solid #6c9cff;border-radius:999px;padding:5px 14px;font-family:var(--fh);font-size:14px;letter-spacing:.04em;box-shadow:0 2px 0 #0a1b55}
button.chip{padding:5px 14px;border-radius:999px;box-shadow:0 3px 0 #0a1b55;font-size:14px}
.code{font-family:var(--fh);font-size:40px;letter-spacing:.25em;color:#ffe066;text-shadow:0 3px 0 #b25f00,0 6px 10px #0006}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:#888;border:2px solid #fff8}
.dot.on{background:#38e07a}.dot.off{background:#ff4d4d}
.mut{color:#b8cdfa;font-size:13px}
.ver{text-align:center;color:#8fb0f0;font-size:12px;margin-top:6px}
.panel{background:linear-gradient(#2a58c8,#1b3b94);border:3px solid #7aa6ff;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 #0f2468,0 10px 18px #0005,inset 0 1px 0 #ffffff55}
.hd{font-family:var(--fh);font-size:17px;letter-spacing:.03em;text-shadow:0 2px 0 #0a1b55}
.note{background:#0b2272aa;border-radius:12px;padding:10px 12px;font-size:14px;color:#e2ecff;border:1px solid #5d8df0}
.mine{background:linear-gradient(#ffe066,#ff9f1c);color:#4a2700;font-family:var(--fh);font-size:18px;text-align:center;padding:8px;border-radius:12px;box-shadow:0 3px 0 #b25f00;animation:pop 1s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.04)}}
.row{display:flex;gap:8px}.row>button{flex:1}
.logo{display:block;width:fit-content;margin:34px auto 18px;text-align:center;font-family:var(--fh);font-size:46px;letter-spacing:.08em;line-height:1;color:#fff;padding:16px 26px 14px;background:linear-gradient(#ff5547,#c4190f);border:4px solid #fff;border-radius:16px;box-shadow:0 7px 0 #7d140e,0 14px 24px #0007;transform:rotate(-3deg);text-shadow:0 4px 0 #7d140e}
.logo span{display:block;font-size:20px;color:#ffe066;letter-spacing:.7em;margin-top:8px;margin-right:-.7em}
.err{color:#ffd0d0;text-align:center;font-size:14px;min-height:18px;font-weight:700}
.or{text-align:center;color:#b8cdfa;font-size:13px;font-weight:700}
.lp{display:flex;align-items:center;gap:10px;background:#0b2272aa;border:2px solid var(--c);border-radius:999px;padding:6px 8px 6px 6px}
.lp .pt{font-size:24px;width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--c);box-shadow:0 2px 0 #0006}
.lp .pn{flex:1;font-family:var(--fh);font-size:17px;letter-spacing:.02em}
.x{padding:6px 12px;background:linear-gradient(#ff6a5f,#c8281f);box-shadow:0 3px 0 #7d140e}
/* ---------- tablero ---------- */
#boardwrap{container-type:inline-size;width:100%;--u:calc((min(100vw,560px) - 20px)/100)}
@supports (width:1cqw){#boardwrap{--u:1cqw}}
#stage{perspective:1000px;perspective-origin:50% 35%;margin:-2% 0 -3%}
#board{position:relative;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;aspect-ratio:1/1;gap:calc(var(--u)*.25);background:#2b5a45;border:calc(var(--u)*1.5) solid #0f6a47;border-radius:calc(var(--u)*2.4);transform-origin:50% 55%;transform:rotateX(22deg);transition:transform .45s;box-shadow:0 calc(var(--u)*1) 0 #0a4a33,0 calc(var(--u)*2) 0 #073a28,0 calc(var(--u)*3) 0 #052b1e,0 calc(var(--u)*5) calc(var(--u)*5) #000a}
.flat #board{transform:none;box-shadow:0 calc(var(--u)*1) 0 #0a4a33,0 calc(var(--u)*3) calc(var(--u)*3) #0008}
.sq{position:relative;background:linear-gradient(180deg,#fcf8e8,#e8e1c4);color:#1b2a22;display:flex;min-width:0;min-height:0;overflow:hidden;cursor:pointer;box-shadow:inset 0 calc(var(--u)*.2) 0 #fff9}
.sq *{pointer-events:none}
.side-b{flex-direction:column}.side-t{flex-direction:column-reverse}.side-l{flex-direction:row-reverse}.side-r{flex-direction:row}
.band{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.3);background-image:linear-gradient(#ffffff59,transparent 55%,#0002);border:calc(var(--u)*.18) solid #2b3a30;flex:none}
.side-b .band,.side-t .band{height:28%;width:100%}
.side-l .band,.side-r .band{width:28%;height:100%;flex-direction:column}
.hs{display:block;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);background:linear-gradient(#4be07f,#0f8a3c);clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);filter:drop-shadow(0 calc(var(--u)*.15) 0 #0006)}
.ht{display:block;width:calc(var(--u)*3);height:calc(var(--u)*2.1);background:linear-gradient(#ff6a5f,#b3150f);clip-path:polygon(0 28%,12% 0,88% 0,100% 28%,100% 100%,0 100%)}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;min-width:0;min-height:0}
.ic{font-size:calc(var(--u)*4.4)}
.pr{font-family:var(--fh);font-size:calc(var(--u)*2.7);color:#1b2a22}
.ow{flex:none;border:calc(var(--u)*.15) solid #0006}
.side-b .ow,.side-t .ow{height:13%}
.side-l .ow,.side-r .ow{width:13%}
.ow.mg{background-image:repeating-linear-gradient(45deg,transparent 0 3px,#0007 3px 5px)}
.sq.chance{background:linear-gradient(#ffd27a,#ff9a2e)}
.sq.chest{background:linear-gradient(#a6dcff,#3b9cf0)}
.sq.tax{background:linear-gradient(#ffd6e0,#f08aa6)}
.sq.rr{background:linear-gradient(#e6ebef,#a9b6c0)}
.sq.util{background:linear-gradient(#fff3b8,#f1d36a)}
.sq.cn{align-items:center;justify-content:center;text-align:center;flex-direction:column}
.sq.go{background:linear-gradient(#ffc7c2,#ff7a6e)}
.sq.jail{background:linear-gradient(#ffd9a0,#ff9f40)}
.sq.park{background:linear-gradient(#d4f5c4,#7fd36a)}
.sq.gojail{background:linear-gradient(#c3dcff,#5b97ee)}
.cn .ic{font-size:calc(var(--u)*6)}
.cn .cap{font-family:var(--fh);font-size:calc(var(--u)*1.9);letter-spacing:.03em;text-transform:uppercase;line-height:1}
.hot{animation:hot 1.1s ease-in-out infinite;z-index:3}
@keyframes hot{0%,100%{box-shadow:inset 0 0 0 calc(var(--u)*.5) #ffd34d,0 0 calc(var(--u)*1) #ffd34d99}50%{box-shadow:inset 0 0 0 calc(var(--u)*.9) #ffd34d,0 0 calc(var(--u)*2.4) #ffd34d}}
#tkl{position:absolute;inset:0;pointer-events:none;z-index:6}
.tok{position:absolute;width:0;height:0;transition:left .15s linear,top .15s linear}
.tok b{position:absolute;left:calc(var(--u)*-2.1);top:calc(var(--u)*-.6);width:calc(var(--u)*4.2);height:calc(var(--u)*1.7);border-radius:50%;background:var(--c);border:calc(var(--u)*.25) solid #fff;box-shadow:0 calc(var(--u)*.4) calc(var(--u)*.6) #000a}
.tok span{position:absolute;left:calc(var(--u)*-2.6);top:calc(var(--u)*-5.6);width:calc(var(--u)*5.2);text-align:center;font-size:calc(var(--u)*4.6);line-height:1;filter:drop-shadow(0 calc(var(--u)*.3) calc(var(--u)*.3) #0009);transform:scaleY(1.08);transform-origin:50% 100%}
.flat .tok span{transform:none}
.tok.cur span{animation:bob .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-1.1)) scaleY(1.08)}}
#ctr{grid-row:2/11;grid-column:2/11;background:radial-gradient(circle at 50% 38%,#e4f6df,#b5deb9 70%,#9fd0a6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2);overflow:hidden;box-shadow:inset 0 0 calc(var(--u)*3) #0004;position:relative}
.banner{font-family:var(--fh);font-size:calc(var(--u)*7.4);letter-spacing:.06em;line-height:1;color:#fff;background:linear-gradient(#ff5547,#c4190f);padding:calc(var(--u)*1.3) calc(var(--u)*3.2) calc(var(--u)*1.1);border:calc(var(--u)*.5) solid #fff;border-radius:calc(var(--u)*1.4);box-shadow:0 calc(var(--u)*.9) 0 #7d140e,0 calc(var(--u)*1.6) calc(var(--u)*2) #0006;transform:rotate(-5deg);text-shadow:0 calc(var(--u)*.5) 0 #7d140e}
.banner small{display:block;font-size:calc(var(--u)*2.4);letter-spacing:.7em;margin-right:-.7em;color:#ffe066;margin-top:calc(var(--u)*.4)}
.mid{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2.2);width:100%}
.deck{width:calc(var(--u)*11);height:calc(var(--u)*8);border-radius:calc(var(--u)*1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--u)*3.6);line-height:1;color:#fff;font-family:var(--fh);box-shadow:calc(var(--u)*.3) calc(var(--u)*.3) 0 #0004,calc(var(--u)*.7) calc(var(--u)*.7) 0 #0003,0 calc(var(--u)*1) calc(var(--u)*1) #0005;border:calc(var(--u)*.3) solid #fff}
.deck small{font-size:calc(var(--u)*1.7);letter-spacing:.08em;margin-top:calc(var(--u)*.4)}
.dk1{background:linear-gradient(#ffb64d,#f07f00);transform:rotate(-12deg)}
.dk2{background:linear-gradient(#59b4ff,#1f72d8);transform:rotate(12deg)}
.dice{display:flex;gap:calc(var(--u)*2)}
.die{width:calc(var(--u)*11);height:calc(var(--u)*11);background:linear-gradient(145deg,#fff,#dfe3ee);border-radius:calc(var(--u)*2.2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*.7) 0 #9aa3bd,0 calc(var(--u)*1.4) calc(var(--u)*1.6) #0006,inset 0 calc(var(--u)*.3) 0 #fff}
.die i{background:radial-gradient(circle at 35% 30%,#555,#050505);border-radius:50%;margin:14%}
.shake .die{animation:tumble .8s cubic-bezier(.2,.8,.3,1)}
.shake .die:last-child{animation-delay:.07s;animation-direction:reverse}
@keyframes tumble{0%{transform:translateY(-220%) rotate(-300deg) scale(.5);opacity:0}45%{transform:translateY(10%) rotate(40deg) scale(1.15);opacity:1}62%{transform:translateY(-22%) rotate(-18deg)}80%{transform:translateY(0) rotate(8deg)}100%{transform:none}}
.cplate{display:flex;align-items:center;gap:calc(var(--u)*1.6);background:#fff;border:calc(var(--u)*.45) solid var(--c);border-radius:999px;padding:calc(var(--u)*.7) calc(var(--u)*3) calc(var(--u)*.7) calc(var(--u)*.8);color:#14306f;box-shadow:0 calc(var(--u)*.7) 0 #0003}
.cplate .ctk{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*4.4);border:calc(var(--u)*.3) solid #fff}
.cplate b{display:block;font-family:var(--fh);font-size:calc(var(--u)*4);line-height:1.05;text-align:left}
.cplate small{display:block;font-size:calc(var(--u)*2.6);font-weight:800;color:#5a6a99;text-align:left;line-height:1.1}
/* ---------- jugadores ---------- */
.pls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:linear-gradient(#2a58c8,#1b3b94);border:3px solid #5d8df0;border-radius:18px;padding:8px 10px 9px;min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;box-shadow:0 4px 0 #0f2468,inset 0 1px 0 #ffffff44;position:relative}
.pl .av{grid-row:1/3;width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;border:4px solid var(--c);box-shadow:0 3px 0 #0006}
.pl.cur{border-color:#ffe066;box-shadow:0 0 0 3px #ffe06688,0 0 22px #ffd34dcc,0 4px 0 #0f2468;animation:pop 1.2s ease-in-out infinite}
.pl.cur:after{content:"🎲";position:absolute;top:-12px;right:-6px;font-size:20px;filter:drop-shadow(0 2px 2px #0008)}
.pl.dead{opacity:.5;filter:grayscale(.9)}
.pl .pn{font-family:var(--fh);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 0 #0a1b55}
.pl .pm{font-family:var(--fh);font-size:17px;color:#5a3500;background:linear-gradient(#ffe066,#f5a623);border-radius:999px;padding:1px 10px;width:fit-content;box-shadow:0 2px 0 #9a5a00;text-shadow:0 1px 0 #fff8}
.pl .pb{grid-column:1/3;font-size:13px;min-height:2px}
.chips{grid-column:1/3;display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chips i{display:inline-block;width:12px;height:16px;border-radius:3px;background:var(--c);border:1.5px solid #fff;box-shadow:0 1px 0 #0006}
.chips i.m{background:#0004;border:2px solid var(--c)}
.lg{font-size:13px;color:#dbe7ff;padding:4px 0;border-bottom:1px solid #ffffff22}
.lg:first-of-type{color:#fff;font-weight:800}
/* ---------- barra y hojas ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#10286fee,#091748f5);border-top:3px solid #6c9cff;max-width:560px;margin:0 auto;z-index:5}
.bar button{flex:1;font-size:15px}
.ov{position:fixed;inset:0;background:#040c32bb;backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(#2652bf,#173189);border-top:4px solid #7aa6ff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-family:var(--fh);font-size:22px;letter-spacing:.02em;text-shadow:0 2px 0 #0a1b55}
#incoming .ov{z-index:30}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:linear-gradient(#173586,#0d2160);border:3px solid #ffe066;padding:10px 16px;border-radius:16px;z-index:40;max-width:92%;font-size:14px;font-weight:700;white-space:pre-line;text-align:center;display:none;box-shadow:0 6px 0 #00000055,0 10px 20px #0008}
.pr-row{display:flex;align-items:center;gap:8px;background:#0b2272aa;border:1px solid #5d8df0;border-radius:12px;padding:8px}
.pr-row .pn2{flex:1;font-weight:800;font-size:14px;min-width:0}
.pr-row .pn2 small{display:block;font-weight:600;color:#b8cdfa}
.pr-row .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pr-row .bt button{padding:8px 10px;font-size:13px}
.dot2{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none;border:2px solid #fff;box-shadow:0 1px 0 #0006}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.trp{background:#0b2272aa;border:2px solid transparent;border-radius:10px;padding:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.trp *{pointer-events:none}
.trp.on{border-color:#ffe066;background:#1f4bb8}
.trp.off{opacity:.35}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:5px 0;border-bottom:1px dashed #0003}.tbl td:last-child{text-align:right;font-weight:900}
.sl{background:#0b2272aa;border-radius:12px;padding:10px;font-size:14px;line-height:1.6}
.deed{background:#fffdf1;color:#1b1b1b;border:4px solid #1b1b1b;border-radius:12px;overflow:hidden;box-shadow:0 5px 0 #0007}
.deed .dh{padding:10px 12px;text-align:center;border-bottom:4px solid #1b1b1b}
.deed .dh small{display:block;font-size:10px;letter-spacing:.2em;font-weight:900;opacity:.85}
.deed .dh b{display:block;font-family:var(--fh);font-size:22px;letter-spacing:.03em;line-height:1.1;margin-top:2px}
.deed .db{padding:10px 14px;font-size:14px}
.deed .db p{margin:0}
.deed .tbl td{border-bottom:1px dashed #0004}

/* ---- v1.2: legibilidad 3D, bandeja de dados, cartas, efectos ---- */
#boardwrap{--ds:calc(var(--u)*9)}
#stage{perspective:1300px;perspective-origin:50% 40%}
#board{transform:rotateX(16deg)}
.side-b .sb{justify-content:flex-start;padding-top:calc(var(--u)*.6)}
.side-t .sb{justify-content:flex-end;padding-bottom:calc(var(--u)*.6)}
.side-l .sb{align-items:flex-end;padding-right:calc(var(--u)*.7)}
.side-r .sb{align-items:flex-start;padding-left:calc(var(--u)*.7)}
.pr{font-size:calc(var(--u)*3);text-shadow:0 0 calc(var(--u)*.5) #fff,0 0 calc(var(--u)*.5) #fff,0 0 calc(var(--u)*.3) #fff}
.sq.chance .pr,.sq.chest .pr{text-shadow:none}
.tok b{left:calc(var(--u)*-1.8);top:calc(var(--u)*-.55);width:calc(var(--u)*3.6);height:calc(var(--u)*1.5)}
.tok span{left:calc(var(--u)*-2.2);top:calc(var(--u)*-4.9);width:calc(var(--u)*4.4);font-size:calc(var(--u)*4)}
#toast{top:auto;bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.deck{position:absolute;top:calc(var(--u)*1.8);width:calc(var(--u)*9);height:calc(var(--u)*6.4);font-size:calc(var(--u)*3)}
.dk1{left:calc(var(--u)*1.8)}.dk2{right:calc(var(--u)*1.8)}
.deck small{font-size:calc(var(--u)*1.4)}
.banner{margin-top:calc(var(--u)*.6);font-size:calc(var(--u)*6.6)}
#ctr{gap:calc(var(--u)*2)}

/* ---- v1.3 ---- */
.sheet{animation:none}.sheet.anim{animation:up .22s ease-out}

.thint{position:absolute;left:50%;bottom:calc(var(--u)*1.2);transform:translateX(-50%);white-space:nowrap;font-family:var(--fh);font-size:calc(var(--u)*3.1);color:#4a2700;background:linear-gradient(#ffe066,#ff9f1c);border:calc(var(--u)*.3) solid #fff;border-radius:999px;padding:calc(var(--u)*.6) calc(var(--u)*2.4);box-shadow:0 calc(var(--u)*.5) 0 #b25f00;pointer-events:none;animation:pop 1s ease-in-out infinite}

@keyframes tbn{0%{transform:translateY(-120px) scale(.7);opacity:0}14%{transform:translateY(0) scale(1.06);opacity:1}22%{transform:scale(1)}80%{transform:translateY(0);opacity:1}100%{transform:translateY(-90px);opacity:0}}
.pl{grid-template-rows:auto auto}

.coll{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 7px;align-items:start}

.cfront .fh{padding:8px 12px 2px;font-family:var(--fh);font-size:20px;letter-spacing:.08em;color:#fff;text-align:center;text-shadow:0 2px 0 #0005}
.cfront .fw{font-size:11px;font-weight:800;color:#fff;text-align:center;padding:0 0 6px;text-shadow:0 1px 0 #0006}
.cfront .fb{flex:1;margin:0 10px 10px;background:#fffdf1;border-radius:12px;border:3px solid #1b1b1b;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;text-align:center;color:#1b1b1b;min-height:0}
.cfront .fi{font-size:38px;flex:none}
.cfront .ft2{font-family:var(--fh);font-size:clamp(15px,4.4vw,20px);line-height:1.2}
.chint{font-family:var(--fh);color:#fff;font-size:18px;text-shadow:0 2px 0 #000a;animation:pop 1s ease-in-out infinite;text-align:center}
.chint.wait{animation:none;color:#c9d8ff;font-size:15px}
/* figuras */
.tkg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tkb{position:relative;aspect-ratio:1;padding:0;font-size:27px;border-radius:14px;background:linear-gradient(#fff,#dfe5f4);border:4px solid transparent;box-shadow:0 3px 0 #0007;text-shadow:none;line-height:1}
.tkb.me{border-color:var(--c);box-shadow:0 0 0 3px #ffe066,0 3px 0 #0007;transform:translateY(-2px)}
.tkb:disabled{opacity:.35;filter:grayscale(.7)}
.tkb .tkdot{position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #fff}
/* salas */
.rm{display:flex;align-items:center;gap:10px;background:#0b2272aa;border:2px solid #5d8df0;border-radius:16px;padding:10px}
.rm .rc{font-family:var(--fh);font-size:24px;letter-spacing:.1em;color:#ffe066;text-shadow:0 2px 0 #b25f00}
.rm .rb{flex:1;min-width:0}
.rm .rb b{display:block;font-family:var(--fh);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .rb small{display:block;color:#c9d8ff;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm button{padding:9px 12px;font-size:14px;flex:none}
.bd{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:900;margin-top:3px}
.bd.lobby{background:#38e07a;color:#053a1d}.bd.play{background:#ffb347;color:#4a2700}.bd.end{background:#b5c4d9;color:#223}
#srch{position:relative}
#srch .ov{z-index:25}
.hrow2{display:flex;gap:8px;align-items:stretch}
.hrow2 input{flex:2;text-align:center;letter-spacing:.4em;font-weight:800;text-transform:uppercase}
.hrow2 button{flex:1}
.cfix{width:66px;flex:none}
.cc.ghost{opacity:.5;border-style:dashed;cursor:default}
.cc.off{opacity:.4;cursor:not-allowed}
.jcp{width:66px}
.cc .nb.jcn{font-size:14px}

/* ---- v1.5: marcas de dueño con forma propia ---- */
.ow{border:0!important;background:none!important;background-image:none!important;position:relative}
.side-b .ow,.side-t .ow{height:27%;width:100%}
.side-l .ow,.side-r .ow{width:27%;height:100%}
.ow svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ow.mg svg{opacity:.45;filter:grayscale(.55)}
.shm{width:26px;height:11px;flex:none;display:block;overflow:visible}
.shm.lgm{width:42px;height:16px;padding:0}
.od2{position:absolute;top:2px;right:2px;z-index:1;line-height:0}
.od2 .shm{width:16px;height:8px}
.pmr{display:flex;align-items:center;grid-column:2;align-self:start}
.pl>.pmr .shm{position:absolute;left:34px;bottom:3px;width:30px;height:12px;filter:drop-shadow(0 2px 0 #0007)}
.pl .pmr .pm{align-self:auto}
.tkb .tkp{position:absolute;left:50%;bottom:3px;width:24px;height:8px;transform:translateX(-50%)}
.tkb{font-size:24px;padding-bottom:9px}

/* ---- v1.6 ---- */
.bill{width:116px;height:56px;border-radius:9px;border:3px solid #ffffffe6;box-shadow:0 7px 14px #000b,inset 0 0 12px #ffffff33}
.bill:before{inset:5px;border-radius:6px;border-width:1.5px}
.bill:after{left:11px;width:22px;height:22px;border-width:1.5px}
.bill b{font-size:32px;margin-left:18px;letter-spacing:.01em}
.bill small{font-size:13px;margin-top:9px;margin-left:12px}
.coin{width:50px;height:50px;font-size:24px;border-width:3px}
.bill.sm{width:40px;height:20px;border-width:1.5px;border-radius:4px;box-shadow:0 2px 3px #0008}
.bill.sm:before{inset:2px;border-width:1px}.bill.sm:after{width:7px;height:7px;left:4px;border-width:1px}
.bill.sm b{font-size:11px;margin-left:5px}
.coin.sm{width:20px;height:20px;font-size:10px;border-width:2px}
.cctl{flex-direction:column;align-items:stretch;gap:8px}
.cctl .crow{display:flex;align-items:center;gap:8px}
.cctl .clb{font-family:var(--fh);font-size:13px;text-shadow:0 1px 0 #0a4a24;white-space:nowrap}
.cctl .amtbox{flex:1;min-width:0}
.cctl .amtbox input{width:100%;min-width:0}
.cctl button.dar{padding:7px 14px;font-size:16px;border-radius:12px;flex:none;box-shadow:0 3px 0 #b25f00,0 5px 8px #0005}
.cctl button.dar small{font-size:11px;margin-top:1px;font-weight:800}
.cctl .avail{font-size:11px;font-weight:800;text-shadow:0 1px 0 #0a4a24;opacity:.95}

/* ---- v1.7 ---- */
.bar button.dim{opacity:.5;filter:grayscale(.6)}

/* ---- v1.9 ---- */
input[type=range]{flex:1;padding:0;height:34px;border:0;background:none;box-shadow:none;accent-color:#ffd34d}

/* ---- v2.1 ---- */
.aord{display:flex;flex-wrap:wrap;gap:6px}
.ac{padding:3px 10px;border-radius:999px;background:#0b2272aa;border:2px solid var(--c);font-weight:800;font-size:12px}
.ac.now{background:linear-gradient(#ffe066,#ff9f1c);color:#4a2700;box-shadow:0 0 12px #ffd34d;animation:pop 1s ease-in-out infinite}
.ac.out{opacity:.4;text-decoration:line-through}
/* ---- v2.0: casas vivas, conteo de dinero, propiedades que viajan ---- */
.band{gap:0}
.hw{position:relative;display:block;flex:none}
.side-b .band,.side-t .band{height:31%}.side-l .band,.side-r .band{width:31%}
.hw1{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4)}
.hwh{width:calc(var(--u)*6.8);height:calc(var(--u)*3.4)}
.side-l .hwh,.side-r .hwh{width:calc(var(--u)*3.4);height:calc(var(--u)*6.8)}
.hw svg{position:absolute;left:50%;top:50%;overflow:visible;transform:translate(-50%,-50%) rotate(var(--r,0deg));filter:drop-shadow(0 calc(var(--u)*.2) 0 #0004)}
.hw1 svg{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4)}
.hwh svg{width:calc(var(--u)*6.8);height:calc(var(--u)*3.4)}
.side-b{--r:0deg}.side-t{--r:180deg}.side-l{--r:90deg}.side-r{--r:-90deg}
.band .hw1+.hw1{margin-left:calc(var(--u)*-1.8)}
.side-l .band .hw1+.hw1,.side-r .band .hw1+.hw1{margin-left:0;margin-top:calc(var(--u)*-1.8)}
.hw.pop svg{animation:hpop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes hpop{0%{transform:translate(-50%,-190%) rotate(var(--r,0deg)) scale(.3);opacity:0}55%{transform:translate(-50%,-44%) rotate(var(--r,0deg)) scale(1.25);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1);opacity:1}}
.mhs{width:13px;height:13px;display:inline-block;flex:none;filter:drop-shadow(0 1px 0 #0003)}
.mhs.hot{width:24px;height:12px}
.cc .mhs{width:11px;height:11px}.cc .mhs.hot{width:22px;height:11px}
.rw .mhs{width:16px;height:16px}.rw .mhs.hot{width:30px;height:15px}
.pl .pm{transition:transform .2s,box-shadow .2s,background .2s;font-variant-numeric:tabular-nums}
.pl .pm.cu{background:linear-gradient(#b6ffd0,#38e07a);color:#064a1f;box-shadow:0 2px 0 #138a45,0 0 16px #7dffb0;transform:scale(1.14)}
.pl .pm.cd{background:linear-gradient(#ffc2bb,#ff5d4e);color:#5a0a05;box-shadow:0 2px 0 #a3261b,0 0 16px #ff8a80;transform:scale(1.14)}
.pl .pm.cu:before{content:"▲ ";font-size:.7em}.pl .pm.cd:before{content:"▼ ";font-size:.7em}
.fly.pc2{filter:drop-shadow(0 10px 10px #000a)}
.pfx{width:96px;height:124px;background:linear-gradient(#fffdf1,#efe8cc);border:4px solid #1b1b1b;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;color:#1b1b1b}
.pfx .ph{padding:6px 4px;text-align:center;border-bottom:4px solid #1b1b1b;min-height:50px;display:flex;flex-direction:column;justify-content:center}
.pfx .ph small{font-size:7px;letter-spacing:.12em;font-weight:900;opacity:.85}
.pfx .ph b{font-family:var(--fh);font-size:12px;line-height:1.05;text-transform:uppercase}
.pfx .pb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pfx .pi{font-size:26px;line-height:1}
.pfx .pp{font-family:var(--fh);font-size:20px}

/* ---- v2.2 ---- */
/* tablero 3D: el recuadro de abajo ya no queda tapado por la losa */
#stage{margin:-2% 0 4.5%}
.flat #stage{margin:0 0 3%}
.wrap>.panel,.wrap>.pls{position:relative;z-index:4}
/* dinero: solo cuenta (sin cambiar de color) */
.pl .pm.cu,.pl .pm.cd{background:linear-gradient(#ffe066,#f5a623);color:#5a3500;box-shadow:0 2px 0 #9a5a00;transform:none}
.pl .pm.cu:before,.pl .pm.cd:before{content:none}
@keyframes got{30%{transform:scale(1.04)}}
/* casillas con aspecto de carta */
#board{gap:calc(var(--u)*.5);background:#1c4636}
.sq{border-radius:calc(var(--u)*1);border:calc(var(--u)*.22) solid #2b2418;background:linear-gradient(180deg,#fffef5 0%,#f1e9cd 62%,#e4dab8 100%);box-shadow:inset 0 calc(var(--u)*.3) 0 #fff,inset 0 calc(var(--u)*-.4) calc(var(--u)*.6) #0000001c,0 calc(var(--u)*.35) 0 #0005;transition:transform .12s}
.sq:active{transform:scale(.95)}
.band{border:0;border-bottom:calc(var(--u)*.22) solid #2b2418;background-image:linear-gradient(#ffffffa0,#ffffff1a 42%,#00000038);box-shadow:inset 0 calc(var(--u)*.25) 0 #ffffff80}
.side-t .band{border-bottom:0;border-top:calc(var(--u)*.22) solid #2b2418}
.side-l .band{border-bottom:0;border-left:calc(var(--u)*.22) solid #2b2418}
.side-r .band{border-bottom:0;border-right:calc(var(--u)*.22) solid #2b2418}
.pr{font-size:calc(var(--u)*2.9);letter-spacing:-.02em;text-shadow:0 0 calc(var(--u)*.4) #fff,0 0 calc(var(--u)*.4) #fff,0 0 calc(var(--u)*.4) #fff;background:none}
.sq.cn{border-radius:calc(var(--u)*1.6)}
.side-l .band,.side-r .band{width:29%}
.side-l .ow,.side-r .ow{width:21%}
.side-l .pr,.side-r .pr{font-size:calc(var(--u)*2.5)}
.side-l .sb,.side-r .sb{padding-left:calc(var(--u)*.3);padding-right:calc(var(--u)*.3)}
.sq.chance,.sq.chest,.sq.tax,.sq.rr,.sq.util{box-shadow:inset 0 calc(var(--u)*.4) 0 #ffffffb0,inset 0 calc(var(--u)*-.5) calc(var(--u)*.8) #00000026,0 calc(var(--u)*.35) 0 #0005}

/* ---- v2.3 ---- */
/* números de distancia (qué dados hacen falta) */
.dn{position:absolute;right:calc(var(--u)*.3);bottom:calc(var(--u)*.3);width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#0f1f5c;color:#fff;border:calc(var(--u)*.4) solid var(--c);font-family:var(--fh);font-size:calc(var(--u)*2);text-shadow:0 1px 0 #000;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*.3) 0 #0007;z-index:3;pointer-events:none;animation:dnin .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dnin{from{transform:scale(.2);opacity:0}}
.dn.lk8{background:#7a4a00;border-color:#ffe066;color:#ffe9a0;box-shadow:0 0 0 calc(var(--u)*.2) #fff,0 calc(var(--u)*.3) 0 #0007}
.dn.no1{opacity:.6}
.side-t .dn{bottom:auto;top:calc(var(--u)*.3)}
.side-l .dn{right:auto;left:calc(var(--u)*.3)}
.side-r .dn{right:calc(var(--u)*.3)}
.sq.cn .dn{right:calc(var(--u)*.4);bottom:calc(var(--u)*.4);left:auto;top:auto}
/* hipotecadas: casilla en gris, rayas y candado (el color del dueño se mantiene) */
.sq.mg{background:linear-gradient(#e6e6e6,#c9c9c9)}
.sq.mg .band{filter:grayscale(1) brightness(.82)}
.sq.mg .sb{filter:grayscale(1);opacity:.8}
.sq.mg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#0000 0 calc(var(--u)*.9),#00000024 calc(var(--u)*.9) calc(var(--u)*1.5));pointer-events:none;z-index:1}
.ow.mg svg{opacity:1;filter:none}
.lkm{position:absolute;left:calc(var(--u)*.3);bottom:calc(var(--u)*.3);font-size:calc(var(--u)*2.9);line-height:1;z-index:2;filter:drop-shadow(0 calc(var(--u)*.2) 0 #0006);pointer-events:none}
.side-t .lkm{bottom:auto;top:calc(var(--u)*.3)}
.side-l .lkm{left:calc(var(--u)*.3);bottom:auto;top:calc(var(--u)*.3)}
.side-r .lkm{left:auto;right:calc(var(--u)*.3);bottom:auto;top:calc(var(--u)*.3)}

/* ---- v2.4: cárcel ---- */
.tok.jailed:after{content:"";position:absolute;left:calc(var(--u)*-2.5);top:calc(var(--u)*-5.4);width:calc(var(--u)*5);height:calc(var(--u)*5.6);background:repeating-linear-gradient(90deg,#444c5a 0 calc(var(--u)*.55),#0000 calc(var(--u)*.55) calc(var(--u)*1.25));border-top:calc(var(--u)*.55) solid #444c5a;border-bottom:calc(var(--u)*.55) solid #444c5a;border-radius:calc(var(--u)*.7);filter:drop-shadow(0 calc(var(--u)*.2) 0 #0008);pointer-events:none}
.cop{position:absolute;font-size:calc(var(--u)*4.6);line-height:1;transform:translate(-50%,-70%);transition:left .95s cubic-bezier(.45,0,.2,1),top .95s cubic-bezier(.45,0,.2,1);filter:drop-shadow(0 calc(var(--u)*.3) calc(var(--u)*.3) #0009);z-index:7}
.siren{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.siren:before,.siren:after{content:"";position:absolute;top:-12%;width:80%;height:62%;filter:blur(26px);opacity:0}
.siren:before{left:-25%;background:radial-gradient(circle,#ff2a2a,#0000 70%);animation:sflash .6s steps(1) 3}
.siren:after{right:-25%;background:radial-gradient(circle,#2a6bff,#0000 70%);animation:sflash .6s steps(1) .3s 3}
@keyframes sflash{0%{opacity:.9}50%{opacity:0}}
.arr{position:fixed;left:50%;top:24%;z-index:57;pointer-events:none;display:flex;align-items:center;gap:12px;background:#10163a;color:#fff;border:5px solid var(--c);border-radius:20px;padding:10px 22px 10px 14px;box-shadow:0 8px 0 #0006,0 0 40px #ff2a2a88;animation:arrin 2.4s cubic-bezier(.2,.9,.3,1.2) both}
.arr span{font-size:46px;line-height:1;animation:cop .5s ease-in-out infinite alternate}
.arr b{display:block;font-family:var(--fh);font-size:26px;letter-spacing:.04em;color:#ffe066;text-shadow:0 3px 0 #b22}
.arr small{display:block;font-weight:800;font-size:14px}
@keyframes arrin{0%{transform:translate(-50%,-30px) scale(.4);opacity:0}14%{transform:translate(-50%,0) scale(1.08);opacity:1}20%{transform:translate(-50%,0) scale(1)}84%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-20px) scale(.9);opacity:0}}
@keyframes cop{to{transform:translateX(5px) rotate(4deg)}}
.slam{position:fixed;z-index:56;pointer-events:none;box-sizing:border-box;background:repeating-linear-gradient(90deg,#3b414d 0 6px,#0000 6px 17px);border-top:7px solid #3b414d;border-bottom:7px solid #3b414d;border-radius:10px;filter:drop-shadow(0 5px 0 #000a)}

/* ---- v2.5 ---- */
.inperr{border-color:#ff5d5d!important;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.jcrow{display:flex;gap:8px;min-height:56px}
.jcrow .cc.ghost{pointer-events:none}

/* ---- v2.6 ---- */
.wrap{padding:10px 14px 104px}
#stage{margin:1% 0 5%}
.flat #stage{margin:1% 0 4%}
/* marcas de dueño hacia afuera */
#owl{position:absolute;inset:0;pointer-events:none;z-index:5}
.om{position:absolute;filter:drop-shadow(0 calc(var(--u)*.25) calc(var(--u)*.2) #0009)}
.om svg{width:100%;height:100%;display:block;overflow:visible}
.om.mg svg{opacity:.8}
/* números de distancia más vistosos */
.dn{width:calc(var(--u)*4.5);height:calc(var(--u)*4.5);font-size:calc(var(--u)*2.6);background:radial-gradient(circle at 35% 30%,#3b55c9,#0f1f5c 70%);border:calc(var(--u)*.45) solid var(--c);box-shadow:0 0 calc(var(--u)*1.4) var(--c),0 calc(var(--u)*.4) 0 #0008;animation:dnin .35s cubic-bezier(.3,1.6,.5,1) both,dnpul 1.3s ease-in-out .4s infinite}
@keyframes dnpul{50%{transform:scale(1.14)}}
.dn.lk8{background:radial-gradient(circle at 35% 30%,#b8731a,#6b3b00 70%);border-color:#ffe066;color:#fff3b8;box-shadow:0 0 calc(var(--u)*1.8) #ffd34d,0 calc(var(--u)*.4) 0 #0008}
.dn.hit{background:radial-gradient(circle at 35% 30%,#ffe066,#ff9f1c 75%);color:#4a2700;border-color:#fff;z-index:6;animation:dnhit .7s ease-in-out infinite;box-shadow:0 0 calc(var(--u)*3) #ffd34d,0 0 0 calc(var(--u)*.4) #b25f00}
@keyframes dnhit{50%{transform:scale(1.45)}}
.dn.dim{opacity:.3;animation:none}
.side-b .dn,.sq.cn .dn{right:calc(var(--u)*.1);bottom:calc(var(--u)*.1)}
.side-t .dn{right:calc(var(--u)*.1);top:calc(var(--u)*.1)}
.side-l .dn{left:calc(var(--u)*.1);bottom:auto;top:calc(var(--u)*.1)}
.side-r .dn{right:calc(var(--u)*.1);bottom:auto;top:calc(var(--u)*.1)}
/* fichas: salto en cada paso */
.tok{transition:left .24s linear,top .24s linear}
.tok.hop span{animation:hop .24s ease-out!important}
@keyframes hop{50%{transform:translateY(calc(var(--u)*-2.2)) scaleY(1.1)}}
/* trato: valor total */
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:6px 10px;border-radius:10px;background:#ffffff1f;border:2px solid #ffffff55;font-weight:800;font-size:13px}
.tot b{font-family:var(--fh);font-size:20px;color:#ffe066;text-shadow:0 2px 0 #000a}
.totd{font-size:11px;font-weight:700;color:#d6e3ff;text-align:right;margin-top:2px}
.tsum{text-align:center;font-weight:800;font-size:14px;background:#0b2272aa;border-radius:12px;padding:8px}
.tsum b{font-family:var(--fh);font-size:17px;color:#ffe066}
.aord.big .ac{font-size:15px;padding:6px 12px}
.aord.big .ac b{font-family:var(--fh);font-size:20px;margin-left:4px}
.aord.big .ac em{font-style:normal;font-family:var(--fh);color:#ffe066}
.ac.now em{color:#7a4a00}
/* fajos de billetes junto al nombre */
.pls.hp{grid-template-columns:1fr}
.pls.hp .pl{grid-template-columns:auto auto 1fr;min-height:66px}
.pls.hp .pl .pn{max-width:150px}
.pls.hp .pl .heap{grid-column:3;grid-row:1/3;align-self:center;justify-self:start;margin-left:18px}
.heap{position:relative;width:70px;height:46px;flex:none;transform:scale(var(--hs,1));transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1);margin-right:4px}
.hb{position:absolute;left:50%;bottom:calc(4px + var(--dy));width:40px;height:19px;border-radius:3px;border:1.5px solid #ffffffcc;background:linear-gradient(135deg,var(--b1),var(--b2));transform:translateX(-50%) translateX(var(--dx)) rotate(var(--r));box-shadow:0 1px 2px #000a;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fh);font-size:9px;text-shadow:0 1px 0 #0006;overflow:hidden}
.hb:before{content:"";position:absolute;inset:2px;border:1px dashed #ffffff77;border-radius:2px}
.hb b{position:relative;margin-left:4px}
.hb.in{animation:hbin .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes hbin{0%{transform:translateX(-50%) translateX(var(--dx)) translateY(-40px) rotate(calc(var(--r) + 80deg)) scale(.35);opacity:0}100%{transform:translateX(-50%) translateX(var(--dx)) rotate(var(--r)) scale(1);opacity:1}}
.hb.out{animation:hbout .5s ease-in both}
@keyframes hbout{to{transform:translateX(-50%) translateX(var(--dx)) translateY(-46px) rotate(calc(var(--r) - 90deg)) scale(.3);opacity:0}}

function resetGame(S){

function rentFor(S,idx,sum,opt){
  const sq=SQ[idx],o=S.owner[idx];
  if(sq.t==='prop'){const h=S.houses[idx]||0;return h?sq.r[h]:sq.r[0]*(monopoly(S,o,sq.g)?2:1);}
  if(sq.t==='rr'){const n=ownedCount(S,o,'rr');const r=25*Math.pow(2,n-1);return(opt&&opt.rr)?r*2:r;}
  const n=ownedCount(S,o,'util');return sum*((opt&&opt.ut)?10:(n===2?10:4));
}
function setEnd(S){const p=curP(S);S.sub=(S.doubles>0&&p&&!p.jail&&!p.bankrupt)?'roll':'end';}

}
function payTo(S,p,payees){
  payees.forEach(x=>{p.money-=x.amt;FX(S,p.id,x.to,x.amt);if(x.to!=='bank'){const q=P(S,x.to);if(q)q.money+=x.amt;}});
}
function charge(S,p,payees){
  const tot=payees.reduce((a,x)=>a+x.amt,0);
  if(p.money>=tot){payTo(S,p,payees);return true;}
  S.debt={pid:p.id,payees};S.sub='debt';
  LOG(S,`⚠️ ${p.name} debe S/${tot} y no le alcanza el efectivo`);return false;
}
function goJail(S,p){p.jf=p.pos;p.pos=10;p.jail=1;S.doubles=0;LOG(S,`🚔 ${p.name} va a la cárcel`);setEnd(S);}
function moveBy(S,p,sum){
  const np=p.pos+sum;

  p.pos=np%40;LOG(S,`${p.name} cae en ${SQ[p.pos].n}`);
  land(S,p,sum);
}
function land(S,p,sum,opt){
  const sq=SQ[p.pos];
  if(sq.t==='prop'||sq.t==='rr'||sq.t==='util'){
    const o=S.owner[p.pos];
    if(o===undefined){S.sub='buy';return;}
    if(o===p.id){setEnd(S);return;}
    if(S.mort[p.pos]){LOG(S,`${sq.n} está hipotecada: no cobra renta`);setEnd(S);return;}
    const ow=P(S,o);const r=rentFor(S,p.pos,sum,opt);
    LOG(S,`💵 ${p.name} paga S/${r} de renta a ${ow.name} (${sq.n})`);
    if(charge(S,p,[{to:o,amt:r}]))setEnd(S);
    return;
  }
  if(sq.t==='tax'){LOG(S,`💸 ${p.name} paga S/${sq.a} de ${sq.n}`);if(charge(S,p,[{to:'bank',amt:sq.a}]))setEnd(S);return;}
  if(sq.t==='gojail'){goJail(S,p);return;}
  if(sq.t==='chance'||sq.t==='chest'){drawCard(S,p,sq.t);return;}
  setEnd(S);
}
function drawCard(S,p,kind){
  const dk=kind==='chance'?'deckC':'deckH',list=kind==='chance'?CHANCE:CHEST;
  const ci=S[dk].shift();const c=list[ci];
  if(c.t!=='jc')S[dk].push(ci);
  /* solo se muestra la carta: la acción se hace cuando el jugador toca "continuar" */
  S.cid=(S.cid||0)+1;S.card={id:S.cid,k:kind,x:c.x,pid:p.id,ci,jc:c.t==='jc'?1:0};S.sub='card';
  LOG(S,`🃏 ${kind==='chance'?'Suerte':'Caja Comunal'} · ${p.name}: ${c.x}`);
}
function applyCard(S,p,kind,c){
  const others=()=>{const n=S.players.length,i=S.players.findIndex(x=>x.id===p.id),o=[];for(let k=1;k<n;k++){const q=S.players[(i+k)%n];if(!q.bankrupt)o.push(q);}return o;};
  switch(c.t){
    case 'to':if(c.to<p.pos){p.money+=200;FX(S,'bank',p.id,200);LOG(S,`${p.name} pasa por la SALIDA: +S/200`);}p.pos=c.to;land(S,p,0);break;
    case 'nearR':{const L=GR.rr;let t=L.find(i=>i>p.pos);if(t===undefined){t=L[0];p.money+=200;FX(S,'bank',p.id,200);LOG(S,`${p.name} pasa por la SALIDA: +S/200`);}p.pos=t;land(S,p,0,{rr:1});break;}
    case 'nearU':{const L=GR.util;let t=L.find(i=>i>p.pos);if(t===undefined){t=L[0];p.money+=200;FX(S,'bank',p.id,200);LOG(S,`${p.name} pasa por la SALIDA: +S/200`);}p.pos=t;const d=[rnd6(),rnd6()];S.dice=d;S.rollId++;S.pw=.5;land(S,p,d[0]+d[1],{ut:1});break;}
    case 'back':p.pos=(p.pos+37)%40;LOG(S,`${p.name} cae en ${SQ[p.pos].n}`);land(S,p,0);break;
    case 'cash':if(c.a>=0){p.money+=c.a;FX(S,'bank',p.id,c.a);setEnd(S);}else if(charge(S,p,[{to:'bank',amt:-c.a}]))setEnd(S);break;
    case 'jail':goJail(S,p);break;
    case 'jc':p.jc.push(kind);setEnd(S);break;
    case 'rep':{let hs=0,ht=0;Object.keys(S.owner).forEach(k=>{if(S.owner[k]===p.id){const h=S.houses[k]||0;if(h===5)ht++;else hs+=h;}});
      const tot=hs*c.h+ht*c.H;if(tot===0)setEnd(S);else if(charge(S,p,[{to:'bank',amt:tot}]))setEnd(S);break;}
    case 'payE':{const pay=others().map(q=>({to:q.id,amt:c.a}));if(charge(S,p,pay))setEnd(S);break;}
    case 'colE':others().forEach(q=>{const a=Math.min(q.money,c.a);q.money-=a;p.money+=a;FX(S,q.id,p.id,a);});setEnd(S);break;
    default:setEnd(S);
  }
}
function rollDice(S,p,pw){
  const a=rnd6(),b=rnd6(),sum=a+b,dbl=a===b;
  S.dice=[a,b];S.rollId=(S.rollId||0)+1;S.pw=Math.max(0,Math.min(1,pw===undefined?.4:(+pw||0)));
  LOG(S,`🎲 ${p.name} sacó ${a}+${b}=${sum}${dbl?' (dobles)':''}`);
  if(p.jail>0){
    if(dbl){p.jail=0;S.doubles=0;LOG(S,`${p.name} sale de la cárcel con dobles`);moveBy(S,p,sum);return;}
    if(p.jail>=3){p.jail=0;LOG(S,`${p.name} debe pagar S/50 para salir de la cárcel`);
      if(charge(S,p,[{to:'bank',amt:50}]))moveBy(S,p,sum);else S.pendMove=sum;return;}
    p.jail++;S.doubles=0;LOG(S,`${p.name} sigue en la cárcel`);S.sub='end';return;
  }
  if(dbl){S.doubles++;if(S.doubles>=3){LOG(S,`${p.name} sacó 3 dobles seguidos`);goJail(S,p);return;}}else S.doubles=0;
  moveBy(S,p,sum);
}

function orderStart(S){
  S.sub='order';S.ord={keys:{},need:S.players.map(p=>p.id),round:1,last:null};
  S.players.forEach(p=>{S.ord.keys[p.id]=[];});
  S.turn=0;
}
function orderRoll(S,p,pw){
  const O=S.ord,a=rnd6(),b=rnd6(),sum=a+b;
  S.dice=[a,b];S.rollId=(S.rollId||0)+1;S.pw=Math.max(0,Math.min(1,pw===undefined?.4:(+pw||0)));O.last=p.id;
  O.keys[p.id].push(sum);O.need=O.need.filter(id=>id!==p.id);
  LOG(S,`🎲 ${p.name} sacó ${a}+${b}=${sum}`);
  orderAdvance(S);
}
function orderAdvance(S){
  const O=S.ord;if(!O)return;
  if(O.need.length){S.turn=S.players.findIndex(x=>x.id===O.need[0]);return;}
  const alive=S.players.filter(p=>!p.bankrupt),groups={};
  alive.forEach(p=>{const k=O.keys[p.id].join(',');(groups[k]=groups[k]||[]).push(p);});
  const tied=Object.values(groups).filter(g=>g.length>1);
  if(tied.length){   /* empate: solo los empatados vuelven a tirar */
    const ids=new Set(tied.reduce((a,g)=>a.concat(g.map(p=>p.id)),[]));
    O.need=S.players.filter(p=>ids.has(p.id)).map(p=>p.id);O.round++;
    LOG(S,`🔁 Empate (${tied.map(g=>g.map(p=>p.name).join(' y ')).join(' · ')}): vuelven a tirar`);
    S.turn=S.players.findIndex(x=>x.id===O.need[0]);return;
  }
  const cmp=(x,y)=>{if(x.bankrupt!==y.bankrupt)return x.bankrupt?1:-1;const A=O.keys[x.id],B=O.keys[y.id];for(let i=0;i<Math.max(A.length,B.length);i++){const d=(B[i]||0)-(A[i]||0);if(d)return d;}return 0;};
  const seat=S.players.map(p=>p.id),keys0=JSON.parse(JSON.stringify(O.keys));
  S.players.sort(cmp);
  S.ordRes={seat,keys:keys0,order:S.players.map(p=>p.id),rid:S.rollId,last:O.last};
  S.turn=0;S.sub='roll';S.doubles=0;S.tn=(S.tn||0)+1;S.ord=null;
  recHist(S);
  LOG(S,`🏁 Orden de juego: ${S.players.filter(p=>!p.bankrupt).map(p=>p.name).join(' → ')}`);
}
function startAuction(S,idx,starter){
  S.auction={idx,bid:0,bidder:null,out:[],bids:{},turn:starter};S.sub='auction';
  const st=P(S,starter);
  LOG(S,`🔨 Subasta de ${SQ[idx].n} · empieza ${st?st.name:'—'}`);
  if(st&&st.money<1){S.auction.out.push(starter);LOG(S,`${st.name} no puede pujar y se retira`);auAdvance(S);}
}
/* pasa el turno de puja al siguiente jugador que sigue en la subasta (y cierra si ya terminó) */
function auAdvance(S){
  for(let g=0;g<24;g++){
    auctionCheck(S);if(!S.auction)return;
    const A=S.auction,n=S.players.length,i=Math.max(0,S.players.findIndex(p=>p.id===A.turn));
    let nxt=null;
    for(let k=1;k<=n;k++){const q=S.players[(i+k)%n];if(!q.bankrupt&&!A.out.includes(q.id)){nxt=q;break;}}
    if(!nxt)return;
    A.turn=nxt.id;
    if(nxt.id!==A.bidder&&nxt.money<=A.bid){A.out.push(nxt.id);LOG(S,`${nxt.name} no puede pujar más y se retira`);continue;}
    return;
  }
}
function auctionCheck(S,force){
  const A=S.auction;if(!A)return;
  const ac=act(S).filter(p=>!A.out.includes(p.id));
  let done=false,win=null;
  if(force){done=true;win=A.bidder;}
  else if(ac.length===0){done=true;}
  else if(ac.length===1&&A.bidder===ac[0].id){done=true;win=A.bidder;}
  if(!done)return;
  if(win){const w=P(S,win);w.money-=A.bid;FX(S,w.id,'bank',A.bid);FXP(S,'bank',w.id,A.idx,1);S.owner[A.idx]=win;LOG(S,`🏷 ${w.name} gana ${SQ[A.idx].n} por S/${A.bid}`);}
  else LOG(S,`Nadie compró ${SQ[A.idx].n}`);
  S.auction=null;setEnd(S);
}
function bankrupt(S,p,cred){
  let nfx=0;
  Object.keys(S.owner).forEach(k=>{if(S.owner[k]===p.id){delete S.houses[k];if(cred){if(nfx++<4)FXP(S,p.id,cred.id,+k);S.owner[k]=cred.id;}else{delete S.owner[k];delete S.mort[k];}}});
  if(cred){FX(S,p.id,cred.id,Math.max(0,p.money));cred.money+=Math.max(0,p.money);p.jc.forEach(x=>cred.jc.push(x));}
  else p.jc.forEach(x=>{if(x==='chance')S.deckC.push(JC_C);else S.deckH.push(JC_H);});
  p.money=0;p.jc=[];p.bankrupt=true;p.jail=0;
  if(S.trade&&(S.trade.from===p.id||S.trade.to===p.id))S.trade=null;
  LOG(S,`💀 ${p.name} quebró${cred?' ante '+cred.name:''}`);
  const left=act(S);
  if(left.length<=1){S.phase='end';S.winner=left[0]?left[0].id:null;S.sub='end';S.auction=null;S.debt=null;S.trade=null;LOG(S,`🏆 ${left[0]?left[0].name:'Nadie'} gana la partida`);return;}
  if(curP(S).id===p.id){nextTurn(S);}
  else if(S.auction){if(S.auction.turn===p.id)auAdvance(S);else auctionCheck(S);}
}
function resign(S,t){
  if(t.bankrupt)return'Ya está en quiebra';
  if(S.sub==='order'){   /* todavía no hay dinero en juego: simplemente sale */
    t.bankrupt=true;t.money=0;S.ord.need=S.ord.need.filter(id=>id!==t.id);LOG(S,`💀 ${t.name} sale de la partida`);
    const left=act(S);
    if(left.length<=1){S.phase='end';S.winner=left[0]?left[0].id:null;S.sub='end';S.ord=null;LOG(S,`🏆 ${left[0]?left[0].name:'Nadie'} gana la partida`);return true;}
    orderAdvance(S);return true;
  }
  if(S.auction&&S.auction.bidder===t.id)return'Espera a que termine la subasta';
  let cred=null;
  if(S.sub==='debt'&&S.debt&&S.debt.pid===t.id&&S.debt.payees.length===1&&S.debt.payees[0].to!=='bank'){const c=P(S,S.debt.payees[0].to);if(c&&!c.bankrupt)cred=c;}
  bankrupt(S,t,cred);return true;
}
/* validaciones de construcción/hipoteca (las usa también la interfaz) */
function chkBuild(S,pid,idx){
  const sq=SQ[idx];if(sq.t!=='prop')return'No se puede construir aquí';
  if(S.owner[idx]!==pid)return'No es tuya';
  if(!monopoly(S,pid,sq.g))return'Necesitas todo el color';
  const grp=GR[sq.g];if(grp.some(i=>S.mort[i]))return'Hay hipotecas en el color';
  const h=S.houses[idx]||0;if(h>=5)return'Ya tiene hotel';
  if(h>Math.min(...grp.map(i=>S.houses[i]||0)))return'Construye parejo';
  if(P(S,pid).money<sq.h)return'No te alcanza';
  const s=supply(S);if(h<4&&s.hs>=32)return'No hay casas disponibles';if(h===4&&s.ht>=12)return'No hay hoteles disponibles';
  return null;
}
function chkSell(S,pid,idx){
  const sq=SQ[idx];if(sq.t!=='prop')return'No aplica';if(S.owner[idx]!==pid)return'No es tuya';
  const h=S.houses[idx]||0;if(h<1)return'No hay edificios';
  if(h<Math.max(...GR[sq.g].map(i=>S.houses[i]||0)))return'Vende parejo';
  if(h===5&&supply(S).hs>28)return'No hay casas para bajar el hotel';
  return null;
}
function chkMort(S,pid,idx){
  const sq=SQ[idx];if(!sq.g)return'No aplica';if(S.owner[idx]!==pid)return'No es tuya';if(S.mort[idx])return'Ya está hipotecada';
  if(GR[sq.g].some(i=>(S.houses[i]||0)>0))return'Vende los edificios del color primero';
  return null;
}
const unmortCost=idx=>Math.ceil(SQ[idx].p*0.55);
function chkUnmort(S,pid,idx){
  const sq=SQ[idx];if(!sq.g)return'No aplica';if(S.owner[idx]!==pid)return'No es tuya';if(!S.mort[idx])return'No está hipotecada';
  if(P(S,pid).money<unmortCost(idx))return'No te alcanza';return null;
}
/* tratos */
function normSide(s){
  if(!s||typeof s!=='object')return null;
  const cash=s.cash===undefined?0:s.cash;const jc=Math.max(0,Math.min(2,Math.floor(+s.jc||0)));
  if(!Number.isInteger(cash)||cash<0)return null;
  const props=Array.isArray(s.props)?s.props:[];
  if(!props.every(i=>Number.isInteger(i)&&i>=0&&i<40)||new Set(props).size!==props.length)return null;
  return{cash,props,jc};
}
function chkSide(S,pid,sd){
  const p=P(S,pid);
  if(sd.cash>p.money)return`${p.name} no tiene tanto efectivo`;
  if(sd.jc>p.jc.length)return`${p.name} no tiene esa carta`;
  for(const i of sd.props){
    if(!SQ[i].g||S.owner[i]!==pid)return'Propiedad inválida';
    if(GR[SQ[i].g].some(j=>(S.houses[j]||0)>0))return`Hay que vender los edificios del color ${GN[SQ[i].g]} primero`;
  }
  return null;
}

/* ---- reductor principal: devuelve true si la acción es válida; si no, un texto de error ---- */
/* salas empezadas antes: cada jugador pasa a su puesto (por su color) y recibe la figura de ese puesto */
function migrateSlots(S){
  if(!S.players.some(p=>p.sl===undefined||!SLOTS[p.sl]||p.col!==SLOTS[p.sl].c))return;
  const taken=new Set();
  S.players.forEach(p=>{
    if(p.sl===undefined||!SLOTS[p.sl]||taken.has(p.sl)){
      const k=SLOTS.findIndex((x,ix)=>x.c===p.col&&!taken.has(ix));
      p.sl=k>=0?k:undefined;
    }
    if(p.sl!==undefined)taken.add(p.sl);
  });
  S.players.forEach(p=>{if(p.sl===undefined){let k=0;while(taken.has(k)&&k<5)k++;p.sl=k;taken.add(k);}p.col=SLOTS[p.sl].c;});
}
function reduce(S,a){
  migrateSlots(S);
  const by=a.by;
  if(a.t==='join'){
    if(S.phase!=='lobby')return'La partida ya empezó';
    if(P(S,by))return true;
    if(S.players.length>=6)return'La sala está llena';
    const nm=String(a.name||'').trim().slice(0,14);
    if(!nm)return'Escribe tu nombre';
    if(a.dev&&S.players.some(p=>p.dev===a.dev))return'Ya estás en esta sala desde este dispositivo';
    const un=uniqueName(S,nm);
    addPlayer(S,by,un,a.dev);LOG(S,`${un} se unió a la sala`);return true;
  }
  const me=P(S,by);if(!me)return'No estás en la sala';
  if(a.t==='bind'){if(!me.dev&&a.dev)me.dev=String(a.dev).slice(0,24);return true;}
  const host=by===S.host,play=S.phase==='play',cp=S.players[S.turn],mine=!!cp&&cp.id===by;
  if(S.card&&['roll','buy','decline','end','payJail','useJc','payDebt','bankrupt'].includes(a.t))return'Primero cierra la carta';
  if(S.trade&&S.phase==='play'&&['roll','buy','decline','end','payJail','useJc'].includes(a.t))return'⏸ Partida en pausa: hay un trato esperando respuesta';
  if(S.trade&&S.phase==='play'&&['build','sell','mort','unmort'].includes(a.t)&&(S.trade.from===by||S.trade.to===by))return'Estás en medio de un trato';
  switch(a.t){
    case 'token':{
      if(S.phase!=='lobby')return'Solo en la sala de espera';
      const T=TOKS.find(x=>x.e===a.tk);if(!T)return'Figura inválida';
      if(S.players.some(p=>p.id!==by&&p.tk===T.e))return'Esa figura ya está ocupada';
      me.tk=T.e;return true;}   /* solo cambia la pieza: el color y la figura siguen siendo los de tu puesto */
    case 'cardOk':
      if(!S.card)return true;
      if(by!==S.card.pid&&!host)return'Solo quien sacó la carta';
      {const cd=S.card,pl=P(S,cd.pid),list=cd.k==='chance'?CHANCE:CHEST;
       S.card=null;
       if(pl&&!pl.bankrupt&&play)applyCard(S,pl,cd.k,list[cd.ci]);else setEnd(S);}
      return true;
    case 'cash':if(!host||S.phase!=='lobby')return'No permitido';if(![1000,1500,2000,3000].includes(a.v))return'Valor inválido';S.cash=a.v;return true;
    case 'leave':
      if(S.phase!=='lobby')return'En partida usa "Rendirme"';
      S.players=S.players.filter(p=>p.id!==by);
      if(!S.players.length){S.__del=true;return true;}
      if(S.host===by)S.host=S.players[0].id;return true;
    case 'prune':{           /* sala de espera: se saca a quien lleva un rato desconectado */
      if(S.phase!=='lobby')return'Solo en la sala de espera';
      const g=P(S,a.pid);if(!g||g.id===by)return'Jugador inválido';
      return reduce(S,{t:'leave',by:g.id});}
    case 'quit':{            /* salir de la sala: dejas de jugar y no vuelves */
      if(S.phase==='lobby')return reduce(S,{t:'leave',by});
      const wasHost=S.host===by;
      if(play&&!me.bankrupt){const r=resign(S,me);if(r!==true)return r;}
      me.left=true;
      if(wasHost){const nh=S.players.find(p=>!p.left&&!p.bankrupt)||S.players.find(p=>!p.left);if(nh)S.host=nh.id;}
      if(S.players.every(p=>p.left))S.__del=true;
      return true;}
    case 'kick':{
      if(!host)return'Solo el anfitrión';
      const t=P(S,a.pid);if(!t||t.id===by)return'Jugador inválido';
      if(S.phase==='lobby'){S.players=S.players.filter(p=>p.id!==t.id);return true;}
      if(!play)return'No permitido';
      const r=resign(S,t);return r;}
    case 'start':{
      if(!host||S.phase!=='lobby')return'Solo el anfitrión puede empezar';
      if(S.players.length<2)return'Se necesitan al menos 2 jugadores';
      resetGame(S);
      S.deckC=shuffle(CHANCE.map((_,i)=>i));S.deckH=shuffle(CHEST.map((_,i)=>i));
      S.phase='play';orderStart(S);LOG(S,'🎲 ¡Empieza la partida! Cada jugador tira los dados: el puntaje más alto juega primero');return true;}
    case 'restart':
      if(!host||S.phase!=='end')return'No permitido';
      S.players=S.players.filter(p=>!p.left);S.phase='lobby';resetGame(S);S.players.forEach(p=>{p.money=0;});return true;
    case 'roll':
      if(play&&mine&&S.sub==='order'){orderRoll(S,me,a.pw);return true;}
      if(!play||!mine||S.sub!=='roll')return'No puedes tirar ahora';rollDice(S,me,a.pw);return true;
    case 'buy':{
      if(!play||!mine||S.sub!=='buy')return'No puedes comprar ahora';
      const sq=SQ[me.pos];if(me.money<sq.p)return'No te alcanza el efectivo';
      me.money-=sq.p;FX(S,me.id,'bank',sq.p);FXP(S,'bank',me.id,me.pos,1);S.owner[me.pos]=me.id;LOG(S,`🏷 ${me.name} compra ${sq.n} por S/${sq.p}`);setEnd(S);return true;}
    case 'decline':if(!play||!mine||S.sub!=='buy')return'No hay nada que subastar';startAuction(S,me.pos,me.id);return true;
    case 'end':if(!play||!mine||S.sub!=='end')return'Aún no puedes terminar el turno';nextTurn(S);return true;
    case 'payJail':
      if(!play||!mine||S.sub!=='roll'||me.jail<1)return'No estás en la cárcel';
      if(me.money<50)return'No te alcanza';me.money-=50;FX(S,me.id,'bank',50);me.jail=0;LOG(S,`${me.name} paga S/50 y sale de la cárcel`);return true;
    case 'useJc':{
      if(!play||!mine||S.sub!=='roll'||me.jail<1||!me.jc.length)return'No puedes usar la carta';
      const k=me.jc.shift();if(k==='chance')S.deckC.push(JC_C);else S.deckH.push(JC_H);
      me.jail=0;LOG(S,`${me.name} usa su carta y sale de la cárcel`);return true;}
    case 'payDebt':{
      if(!play||!mine||S.sub!=='debt'||!S.debt)return'No hay deuda';
      const tot=S.debt.payees.reduce((s,x)=>s+x.amt,0);
      if(me.money<tot)return`Te faltan S/${tot-me.money}`;
      payTo(S,me,S.debt.payees);S.debt=null;LOG(S,`${me.name} paga su deuda`);
      if(S.pendMove!=null){const m=S.pendMove;S.pendMove=null;moveBy(S,me,m);}else setEnd(S);
      return true;}
    case 'bankrupt':
      if(!play||!mine||S.sub!=='debt')return'Solo puedes quebrar si tienes una deuda';
      return resign(S,me);
    case 'resign':if(!play)return'No permitido';return resign(S,me);
    case 'bid':{
      const A=S.auction;if(!play||S.sub!=='auction'||!A)return'No hay subasta';
      if(me.bankrupt||A.out.includes(by))return'Ya no participas';
      if(A.turn!==by)return'Espera tu turno para pujar';
      const v=a.amt;if(!Number.isInteger(v)||v<=A.bid)return'La oferta debe ser mayor';
      if(v>me.money)return'No te alcanza el efectivo';
      A.bid=v;A.bidder=by;(A.bids=A.bids||{})[by]=v;LOG(S,`🔨 ${me.name} ofrece S/${v} por ${SQ[A.idx].n}`);auAdvance(S);return true;}
    case 'pass':{
      const A=S.auction;if(!play||S.sub!=='auction'||!A)return'No hay subasta';
      if(me.bankrupt||A.out.includes(by))return'Ya te retiraste';
      if(A.turn!==by)return'Espera tu turno para decidir';
      if(A.bidder===by)return'Eres el mayor postor';
      A.out.push(by);LOG(S,`${me.name} se retira de la subasta`);auAdvance(S);return true;}
    case 'skip':{
      if(!host||!play)return'Solo el anfitrión';
      const p=curP(S);
      if(S.sub==='order'){LOG(S,`⏭ El anfitrión tira por ${p.name}`);orderRoll(S,p);return true;}
      if(S.auction){
        const A=S.auction,tp=P(S,A.turn);
        if(tp&&!tp.bankrupt&&A.bidder!==tp.id&&!A.out.includes(tp.id)){A.out.push(tp.id);LOG(S,`⏭ El anfitrión retira a ${tp.name} de la subasta`);auAdvance(S);}
        else auctionCheck(S,true);
        return true;}
      if(S.sub==='debt'){return resign(S,p);}
      S.trade=null;LOG(S,`⏭ El anfitrión salta el turno de ${p.name}`);nextTurn(S);return true;}
    case 'build':case 'sell':case 'mort':case 'unmort':{
      if(!play)return'No permitido';if(S.auction)return'Hay una subasta en curso';
      const i=a.idx;if(!Number.isInteger(i)||!SQ[i])return'Casilla inválida';
      const sq=SQ[i];let e;
      if(a.t==='build'){e=chkBuild(S,by,i);if(e)return e;me.money-=sq.h;FX(S,me.id,'bank',sq.h);S.houses[i]=(S.houses[i]||0)+1;LOG(S,`🏠 ${me.name} construye en ${sq.n}`);}
      else if(a.t==='sell'){e=chkSell(S,by,i);if(e)return e;me.money+=sq.h/2;FX(S,'bank',me.id,sq.h/2);S.houses[i]--;if(!S.houses[i])delete S.houses[i];LOG(S,`${me.name} vende un edificio de ${sq.n}`);}
      else if(a.t==='mort'){e=chkMort(S,by,i);if(e)return e;me.money+=sq.p/2;FX(S,'bank',me.id,sq.p/2);S.mort[i]=1;LOG(S,`${me.name} hipoteca ${sq.n} (+S/${sq.p/2})`);}
      else{e=chkUnmort(S,by,i);if(e)return e;me.money-=unmortCost(i);FX(S,me.id,'bank',unmortCost(i));delete S.mort[i];LOG(S,`${me.name} deshipoteca ${sq.n}`);}
      return true;}
    case 'tradeOffer':{
      if(!play||S.auction)return'No se puede ahora';
      if(S.sub==='order')return'Primero termina el sorteo de orden';
      if(S.card)return'Espera a que se cierre la carta';
      if(S.trade)return'Ya hay un trato pendiente';
      if(me.bankrupt)return'Estás en quiebra';
      const to=P(S,a.to);if(!to||to.bankrupt||to.id===by)return'Jugador inválido';
      const g=normSide(a.give),t=normSide(a.get);if(!g||!t)return'Oferta inválida';
      if(!g.cash&&!g.props.length&&!g.jc&&!t.cash&&!t.props.length&&!t.jc)return'La oferta está vacía';
      const e=chkSide(S,by,g)||chkSide(S,to.id,t);if(e)return e;
      S.trade={id:S.n+1,from:by,to:to.id,give:g,get:t};LOG(S,`🤝 ${me.name} le propone un trato a ${to.name}`);return true;}
    case 'tradeAccept':{
      const T=S.trade;if(!play||!T||T.to!==by||S.auction)return'No hay trato para aceptar';
      const A=P(S,T.from),B=me;
      const e=chkSide(S,A.id,T.give)||chkSide(S,B.id,T.get);if(e)return e;
      const fee=l=>l.filter(i=>S.mort[i]).reduce((s,i)=>s+Math.ceil(SQ[i].p*0.05),0);
      const feeB=fee(T.give.props),feeA=fee(T.get.props);
      if(A.money+T.get.cash-T.give.cash-feeA<0)return`${A.name} no tiene efectivo suficiente`;
      if(B.money+T.give.cash-T.get.cash-feeB<0)return'No te alcanza el efectivo (hay 10% extra por propiedades hipotecadas)';
      T.give.props.forEach(i=>FXP(S,A.id,B.id,i));T.get.props.forEach(i=>FXP(S,B.id,A.id,i));
      A.money+=T.get.cash-T.give.cash-feeA;B.money+=T.give.cash-T.get.cash-feeB;FX(S,A.id,B.id,T.give.cash);FX(S,B.id,A.id,T.get.cash);FX(S,A.id,'bank',feeA);FX(S,B.id,'bank',feeB);
      T.give.props.forEach(i=>{S.owner[i]=B.id;});T.get.props.forEach(i=>{S.owner[i]=A.id;});
      for(let k=0;k<T.give.jc;k++)B.jc.push(A.jc.shift());
      for(let k=0;k<T.get.jc;k++)A.jc.push(B.jc.shift());
      S.trade=null;LOG(S,`🤝 ${A.name} y ${B.name} cerraron un trato`);return true;}

function sndDiff(){
  if(!S||!code)return;
  const n=S.n||0;
  if(ui.sndRoom===code&&ui.sndN===n)return;
  const cur={ph:S.phase,np:S.players.length,own:Object.assign({},S.owner||{}),hs:Object.assign({},S.houses||{}),mort:Object.assign({},S.mort||{}),jail:{},bk:{},tr:S.trade?S.trade.id:null,au:S.auction?S.auction.bid:null,sub:S.sub,ln:S.ln||0,auT:S.auction?S.auction.turn:null};
  S.players.forEach(p=>{cur.jail[p.id]=p.jail||0;cur.bk[p.id]=!!p.bankrupt;});
  const o=ui.snd,same=ui.sndRoom===code;
  ui.snd=cur;ui.sndN=n;ui.sndRoom=code;
  if(!o||!same)return;
  const later=fn=>setTimeout(fn,Math.max(0,ui.holdUntil-Date.now()));
  const nl=Math.max(0,cur.ln-o.ln),newLog=nl?(S.log||[]).slice(-Math.min(8,nl)):[];
  if(o.ph==='lobby'&&cur.ph==='play'){SND.start();return;}
  if(o.ph!=='end'&&cur.ph==='end'){const w=S.winner;later(()=>w===me?SND.win():SND.lose());return;}
  if(cur.ph==='lobby'){if(cur.np>o.np)SND.join();return;}
  let broke=false;
  for(const id in cur.bk)if(cur.bk[id]&&!o.bk[id]){broke=true;later(()=>SND.bankrupt());}
  let gained=0,mineG=false,moved=0;
  for(const k in cur.own){if(o.own[k]===undefined){gained++;if(cur.own[k]===me)mineG=true;}else if(o.own[k]!==cur.own[k])moved++;}
  if(gained)SND.q(mineG?1:.6,()=>SND.buy());
  if(newLog.some(l=>l.includes('cerraron un trato')))SND.tradeOk();
  else if(o.tr&&!cur.tr&&newLog.some(l=>l.includes('rechaza')||l.includes('retira')))SND.tradeNo();
  if(cur.tr&&cur.tr!==o.tr&&S.trade&&S.trade.to===me)SND.tradeIn();
  const sum=h=>Object.keys(h).reduce((a,k)=>a+h[k],0),so=sum(o.hs),sc=sum(cur.hs);
  if(sc>so){setTimeout(()=>SND.q(1,()=>Object.keys(cur.hs).some(k=>cur.hs[k]===5&&o.hs[k]!==5)?SND.hotel():SND.build()),560);}
  else if(sc<so&&!broke)SND.sell();
  for(const k in cur.mort)if(!o.mort[k]){SND.mortgage();break;}
  for(const k in o.mort)if(!cur.mort[k]&&cur.own[k]!==undefined){SND.unmortgage();break;}
  for(const id in cur.jail){
    if((o.jail[id]||0)===0&&cur.jail[id]>0){if(!ui.jail[id])later(()=>SND.jail());}
    else if((o.jail[id]||0)>0&&cur.jail[id]===0)later(()=>SND.unjail());
  }
  if(cur.auT===me&&o.auT!==me&&o.au!==null)SND.tradeIn();
  if(cur.au!==null&&o.au===null)SND.auctionStart();
  else if(cur.au!==null&&o.au!==null&&cur.au>o.au)SND.bid();
  if(cur.sub==='debt'&&o.sub!=='debt'&&S.debt&&S.debt.pid===me)later(()=>SND.warn());
}

      const pr=await tmo(db.ref('monopoly_pres/'+c).once('value'),8000);
      {const pv=pr.val()||{};if(Object.values(pv).some(Boolean))continue;}
      await db.ref('monopoly/'+c).remove();await db.ref('monopoly_rooms/'+c).remove();await db.ref('monopoly_pres/'+c).remove();await db.ref('monopoly_draft/'+c).remove();
    }

    try{
      const ctl=new AbortController();setTimeout(()=>ctl.abort(),6000);
      const res=await fetch(FBCFG.databaseURL+'/monopoly.json?shallow=true',{signal:ctl.signal});
      const keys=Object.keys((await res.json())||{}).filter(k=>!all[k]).slice(0,15);
      for(const c of keys){

async function createRoom(){

    if(exists)throw new Error('No se pudo generar un código libre');
    me=uid();const st=newState(me,name,DEV);

async function joinRoom(cArg){
  const name=cleanName();if(!name)return;
  const c=(cArg||$('cd').value||'').trim().toUpperCase();if(c.length!==4){homeErr('El código tiene 4 letras');return;}
  homeErr('Conectando…');
  try{
    const v=await listen(c);
    if(!v||!v.s){ref.off('value');ref=null;homeErr('Esa sala no existe');return;}
    const st=JSON.parse(v.s);
    /* 1) tu asiento es el de tu dispositivo, escribas el nombre que escribas */
    let seat=st.players.find(p=>p.dev&&p.dev===DEV);
    /* 2) si no hay asiento de este dispositivo, el nombre solo sirve para asientos antiguos sin dispositivo */
    if(!seat){
      const same=st.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
      if(same&&!same.dev)seat=same;
      else if(same&&st.phase!=='lobby'){ref.off('value');ref=null;homeErr('Ese jugador ya está registrado en otro dispositivo. Vuelve a entrar desde el mismo dispositivo con el que jugabas.');return;}
      /* en la sala de espera, un nombre repetido de otro dispositivo es otra persona: entra como "Nombre 2" */
    }
    if(seat&&seat.left){ref.off('value');ref=null;homeErr('Saliste de esa partida y ya no puedes volver.');return;}
    if(seat){me=seat.id;enterRoom(v);return;}
    if(st.phase!=='lobby'){ref.off('value');ref=null;homeErr('La partida ya empezó. Solo pueden volver quienes ya estaban jugando.');return;}
    if(st.players.length>=6){ref.off('value');ref=null;homeErr('La sala está llena');return;}
    me=uid();
    let err=null;
    const r=await tmo(ref.transaction(cur=>{
      if(!cur||!cur.s)return;
      const s2=JSON.parse(cur.s);const res=reduce(s2,{t:'join',by:me,name,dev:DEV});
      if(res!==true){err=res;return;}
      return{s:JSON.stringify(s2),u:Date.now()};
    }),10000);
    if(!r.committed){ref.off('value');ref=null;me=null;homeErr(err||'No se pudo entrar');return;}
    /* se usa el valor confirmado por la transacción (no el último que llegó, que puede ser el de antes de entrar) */
    const v2=r.snapshot&&r.snapshot.val();
    enterRoom(v2&&v2.s?v2:lastV);
  }catch(e){if(ref){ref.off('value');ref=null;}me=null;homeErr(errMsg(e));}
}
async function dispatch(a){
  if(!ref||inflight)return;
  inflight=true;let err=null;const c0=code;
  try{
    const r=await tmo(ref.transaction(cur=>{
      err=null;
      if(!cur||!cur.s)return;
      const st=JSON.parse(cur.s);
      const res=reduce(st,a);
      if(res!==true){err=res||'Acción no válida';return;}
      if(st.__del)return null;
      st.n=(st.n||0)+1;
      return{s:JSON.stringify(st),u:Date.now()};
    }),10000);
    if(!r.committed&&err)toast('⚠️ '+err);
    if(r.committed&&r.snapshot){const v=r.snapshot.val();if(v&&v.s){try{pushIndex(JSON.parse(v.s));}catch(e){}}else if(!v)dropIndex(c0);}
  }catch(e){toast('⚠️ '+errMsg(e),4000);}
  finally{inflight=false;}
}

/* sale de la sala en el servidor (espera a que termine lo que se estaba enviando) y recién entonces vuelve al menú */
/* limpieza en segundo plano (con reintentos) cuando uno sale de la sala de espera */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function leaveHandler(pid,wipe,info){
  return cur=>{
    info.err=null;
    if(cur===null)return null;      /* sin datos en caché: Firebase reintenta con el valor real del servidor */
    if(!cur.s)return;
    const st=JSON.parse(cur.s);
    if(!P(st,pid)){info.gone=true;return;}
    const rr=reduce(st,{t:'leave',by:pid});
    if(rr!==true){info.err=rr;return;}
    if(wipe)st.__del=true;
    if(st.__del)return null;
    st.n=(st.n||0)+1;
    return{s:JSON.stringify(st),u:Date.now()};
  };
}
async function bgLeave(r0,c0,pid,wipe,info,first){
  let pr=first;
  for(let k=0;k<5;k++){
    try{
      if(!pr)pr=r0.transaction(leaveHandler(pid,wipe,info));
      const res=await tmo(pr,8000);pr=null;
      if(res&&res.committed){
        const v=res.snapshot.val();
        if(!v||!v.s){dropIndex(c0);}
        else{try{const st=JSON.parse(v.s),pl=st.players.filter(p=>!p.left),h=P(st,st.host);db.ref('monopoly_rooms/'+c0).update({h:h?h.name:'',n:pl.length,ph:st.phase,pn:pl.map(p=>p.name),pt:pl.map(p=>p.tk),u:SVT()});}catch(e){}}
        return;
      }
      if(info.gone||info.err)return;
      /* se canceló sin motivo (p. ej. caché vacía): se lee el valor real y se reintenta */
      const snap=await tmo(r0.once('value'),8000),v=snap.val();
      if(!v||!v.s){dropIndex(c0);return;}
      let st;try{st=JSON.parse(v.s);}catch(e){return;}
      if(!P(st,pid))return;
    }catch(e){pr=null;}
    await sleep(500);
  }
}
async function serverLeave(type){
  if(!ref){leaveLocal(null,true);return;}
  const c0=code,pid=me;
  if(type==='leave'&&S&&S.phase==='lobby'){   /* sala de espera: se sale YA y el servidor se actualiza detrás */
    const r0=ref,wipe=!S.players.some(p=>p.id!==pid&&isOnStrict(p.id)),info={};
    ui.quiet=true;
    const first=r0.transaction(leaveHandler(pid,wipe,info));   /* arranca YA, con los datos en caché */
    leaveLocal(null,true);
    ui.quiet=false;
    try{db.ref('monopoly_pres/'+c0+'/'+pid).set(0);}catch(e){}   /* "ya me fui": los demás me ocultan al instante */
    bgLeave(r0,c0,pid,wipe,info,first);
    return;
  }
  /* si en la sala de espera no queda nadie conectado más que yo, la sala se borra entera de Firebase */
  const wipe=S&&S.phase==='lobby'&&!S.players.some(p=>p.id!==pid&&isOnStrict(p.id));
  for(let k=0;k<40&&inflight;k++)await new Promise(r=>setTimeout(r,100));
  let err=null,r=null;
  try{
    r=await tmo(ref.transaction(cur=>{
      err=null;
      if(!cur||!cur.s)return;
      const st=JSON.parse(cur.s);
      if(!P(st,pid))return;
      const res=reduce(st,{t:type,by:pid});
      if(res!==true){err=res||'No se pudo salir';return;}
      if(wipe)st.__del=true;
      if(st.__del)return null;
      st.n=(st.n||0)+1;
      return{s:JSON.stringify(st),u:Date.now()};
    }),10000);
  }catch(e){toast('⚠️ No se pudo salir de la sala: '+errMsg(e),4000);return;}
  if(err){toast('⚠️ '+err);return;}
  if(r&&r.committed&&r.snapshot){const v=r.snapshot.val();if(v&&v.s){try{pushIndex(JSON.parse(v.s));}catch(e){}}else if(!v)dropIndex(c0);}
  leaveLocal(null,true);
}

const SKY_MS=1000;
function playSky(){
  const q=ui.skyQ;if(!q.length)return;ui.skyQ=[];
  const hl=$('hl'),bd=$('board');if(!hl||!bd)return;
  let delay=0;
  q.forEach(e=>{
    const sq=bd.querySelector(`.sq[data-i="${e.i}"]`);if(!sq)return;
    const hot=e.to===5,list=sq.querySelectorAll('.hw');
    const tgt=hot?list[0]:list[Math.min(list.length-1,Math.max(0,e.to-1))];
    if(!tgt)return;
    const pos=el=>{let x=0,y=0,n=el;while(n&&n!==bd){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}return{x,y};};
    const pt=pos(tgt),cx=pt.x+tgt.offsetWidth/2,cy=pt.y+tgt.offsetHeight/2;
    const side=['side-b','side-t','side-l','side-r'].find(c=>sq.classList.contains(c))||'side-b';
    const el=document.createElement('span');
    el.className='sky '+side;el.style.left=cx+'px';el.style.top=cy+'px';
    el.innerHTML=`<span class="hw ${hot?'hwh':'hw1'}"><svg viewBox="${hot?'0 0 64 32':'0 0 32 32'}"><use href="#${hot?'h-hotel':'h-house'}" width="${hot?64:32}" height="32"/></svg></span>`;
    hl.appendChild(el);
    const H=bd.offsetHeight,up=Math.min(H*.95,cy+H*.35),rot=(Math.random()-.5)*26;
    const a=el.animate([
      {transform:`translate(-50%,calc(-50% - ${up}px)) scale(2.6) rotate(${rot}deg)`,opacity:0,offset:0},
      {opacity:1,offset:.12},
      {transform:`translate(-50%,-50%) scale(1) rotate(0deg)`,opacity:1,offset:.62,easing:'cubic-bezier(.5,0,.9,.6)'},
      {transform:`translate(-50%,-50%) scale(1.18,.8) rotate(0deg)`,offset:.68},
      {transform:`translate(-50%,calc(-50% - ${H*.05}px)) scale(1) rotate(0deg)`,offset:.8},
      {transform:`translate(-50%,-50%) scale(1) rotate(0deg)`,opacity:1,offset:.9},
      {transform:`translate(-50%,-50%) scale(1) rotate(0deg)`,opacity:0,offset:1}
    ],{duration:SKY_MS,delay,fill:'both'});
    a.onfinish=()=>el.remove();
    setTimeout(()=>{            /* golpe: polvo */
      if(!el.isConnected)return;
      const d=document.createElement('span');d.className='dust';d.style.left=cx+'px';d.style.top=cy+'px';hl.appendChild(d);
      d.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:.9},{transform:'translate(-50%,-50%) scale(2.2)',opacity:0}],{duration:520,easing:'ease-out'}).onfinish=()=>d.remove();
    },delay+SKY_MS*.62);
    delay+=170;
  });
}

const hexRGB=h=>{h=String(h||'#888').replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];};
const hex2=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const shade=(col,f)=>hex2(hexRGB(col).map(v=>v*f));

/* fichas: capa aparte para poder animarlas casilla por casilla */
function tokXY(pid){
  const p=P(S,pid),pos=ui.tcur[pid]===undefined?p.pos:ui.tcur[pid];
  const grp=S.players.filter(q=>!q.bankrupt&&(ui.tcur[q.id]===undefined?q.pos:ui.tcur[q.id])===pos);
  const k=grp.findIndex(q=>q.id===pid),n=grp.length;
  const [r,c]=boardPos(pos);
  const sd=sideOf(pos);
  let ox=0,oy=1.2,tx=1,ty=0;
  if(sd==='side-b'){oy=4.3;}
  else if(sd==='side-t'){oy=-2.4;}
  else if(sd==='side-l'){ox=-3.4;oy=2.0;tx=0;ty=1;}
  else if(sd==='side-r'){ox=3.4;oy=2.0;tx=0;ty=1;}
  const sp=n>1?(k-(n-1)/2)*(n>3?2.2:2.8):0;
  return{x:cenU(c)+ox+tx*sp,y:cenU(r)+oy+ty*sp};
}

function ownersHTML(){
  let h='<div id="owl">';
  const L=FRU*.88,T=3.4;
  for(let i=0;i<40;i++){
    const o=S.owner[i];if(o===undefined||i%10===0)continue;
    const p=P(S,o);if(!p||p.bankrupt)continue;
    const sd=sideOf(i),[r,c]=boardPos(i);let x,y,w,hh;
    if(sd==='side-b'){x=cenU(c)-L/2;y=99.2;w=L;hh=T;}

    else if(sd==='side-l'){x=.8-T;y=cenU(r)-L/2;w=T;hh=L;}
    else{x=99.2;y=cenU(r)-L/2;w=T;hh=L;}
    h+=`<div class="om${S.mort[i]?' mg':''}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;width:${w.toFixed(2)}%;height:${hh.toFixed(2)}%">${shapeSVG(p,sd)}</div>`;

function tickTokens(){
  if(!S||S.phase==='lobby'){return;}
  if(animBusy())ui.busyPrev=true;else if(ui.busyPrev){ui.busyPrev=false;render();return;}
  if(S.phase==='play'&&!animBusy()){
    const c0=curP(S),want=S.sub==='roll'&&!S.card&&!c0.jail&&!c0.bankrupt;
    if((want&&!ui.dn)||(!want&&ui.dn)){render();return;}
  }
  if(ui.dice.anim||Date.now()<(ui.cardHold||0))return;
  let ch=false;
  S.players.forEach(p=>{
    let cur=ui.tcur[p.id];
    if(cur===undefined||p.bankrupt){ui.tcur[p.id]=p.pos;return;}
    const J=ui.jail[p.id];
    const target=(J&&J.stage==='walk')?J.jf:((J&&J.stage==='arrest')?cur:p.pos);
    if(J&&J.stage==='walk'&&cur===target){J.stage='arrest';arrestFx(p.id,cur);return;}
    if(cur!==target){
      const d=(target-cur+40)%40;
      ui.tcur[p.id]=(d>14)?target:(cur+1)%40;ch=true;
      if(d<=14&&!(J&&J.stage==='arrest'))ui.hopIds.push(p.id);
      if(d>14)SND.warp();else{ui.stepN=(Date.now()-(ui.stepT||0)>700)?0:(ui.stepN||0)+1;ui.stepT=Date.now();SND.step(ui.stepN);}
    }
  });
  if(!ch)return;
  S.players.forEach(p=>{
    if(p.bankrupt)return;
    const el=document.querySelector('[data-tk="'+p.id+'"]');if(!el)return;
    const q=tokXY(p.id);el.style.left=q.x+'%';el.style.top=q.y+'%';
    if(ui.hopIds.includes(p.id)){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');setTimeout(()=>el.classList.remove('hop'),260);}
  });
  ui.hopIds=[];
}
/* ¿sigue en marcha la animación de dados / fichas / carta? Mientras sí, no se muestran acciones. */
function animBusy(){
  if(!S||S.phase!=='play')return false;
  const now=Date.now();
  const raw=ui.dice.anim||now<ui.holdUntil||now<(ui.cardHold||0)||now<(ui.fxHold||0)||S.players.some(p=>!p.bankrupt&&ui.tcur[p.id]!==undefined&&ui.tcur[p.id]!==p.pos);
  if(!raw){ui.busyT=0;return false;}
  if(!ui.busyT)ui.busyT=now;else if(now-ui.busyT>9000)return false;   /* seguro: nunca bloquea más de 9 s */
  return true;
}
